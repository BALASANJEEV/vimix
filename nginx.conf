worker_processes 1;

# The events block is required for nginx
# and must appear before the http block.
events {
    # Default event handler, no special configuration needed.
}

# All http level configuration must be wrapped in an http block.
http {
    server {
        listen 80;
        server_name localhost;

        # Serve the static files that were built by Vite.
        root /usr/share/nginx/html;
        index index.html index.htm;

        # Fallback for SPA routing.
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Proxy all API calls to the backend running on port 5000.
        location /api/ {
            proxy_pass http://127.0.0.1:5000/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection upgrade;
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }
    }
}
