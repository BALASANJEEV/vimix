server {
    listen 80;
    server_name _;

    # Serve the built frontend assets
    root /var/www/html;
    index index.html index.htm;

    location / {
        try_files $uri $uri/ =404;
    }

    # Expose uploaded files from the Node.js backend
    location /uploads/ {
        alias /usr/src/app/uploads/;
        access_log off;
        expires 30d;
    }

    # Optional: pass API requests to the backend if you ever want Nginx to proxy
    # location /api/ {
    #     proxy_pass http://127.0.0.1:5000/;
    #     proxy_set_header Host $host;
    # }
}
