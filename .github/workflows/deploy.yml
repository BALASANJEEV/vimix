name: Build & Deploy to EC2 Docker

on:
  push:
    branches: ["main"]
  workflow_dispatch:

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: vimix
  INSTANCE_ID: "i-0567fd4d7811faf54"
  SERVER_NAME: "vimix-server"
  PUBLIC_IP: "13.205.31.35"
  TARGET_PORT: "5000"

jobs:
  deploy:
    name: Build, Push and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push Docker image to ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          set -e
          FULL_IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY"
          echo "Building $FULL_IMAGE:latest"
          docker build --tag "$FULL_IMAGE:$GITHUB_SHA" --tag "$FULL_IMAGE:latest" .
          docker push "$FULL_IMAGE:$GITHUB_SHA"
          docker push "$FULL_IMAGE:latest"
          echo "full_image=$FULL_IMAGE" >> "$GITHUB_OUTPUT"

      - name: Deploy to EC2 via SSM
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          set -e
          AWS_REGION="${{ env.AWS_REGION }}"
          INSTANCE_ID="${{ env.INSTANCE_ID }}"
          SERVER_NAME="${{ env.SERVER_NAME }}"
          ECR_REGISTRY="${ECR_REGISTRY:-759204735992.dkr.ecr.ap-south-1.amazonaws.com}"
          REPO="vimix"
          SECRET_ID="deptic/vimix/secrets"
          FULL_IMAGE="$ECR_REGISTRY/$REPO:latest"
          TARGET_PORT="${{ env.TARGET_PORT }}"

          # Dynamic resolution: If INSTANCE_ID is missing or stopped, locate active instance by tag
          if [ -z "$INSTANCE_ID" ] || ! aws ec2 describe-instances --region "$AWS_REGION" --instance-ids "$INSTANCE_ID" --query "Reservations[0].Instances[0].State.Name" --output text 2>/dev/null | grep -q "running"; then
            echo "==> Resolving active EC2 instance by tag Name=$SERVER_NAME..."
            RESOLVED_ID=$(aws ec2 describe-instances --region "$AWS_REGION" \
              --filters "Name=tag:Name,Values=$SERVER_NAME" "Name=instance-state-name,Values=running" \
              --query "Reservations[0].Instances[0].InstanceId" --output text 2>/dev/null || true)
            if [ -n "$RESOLVED_ID" ] && [ "$RESOLVED_ID" != "None" ]; then
              echo "==> Found running instance: $RESOLVED_ID"
              INSTANCE_ID="$RESOLVED_ID"
            fi
          fi

          if [ -z "$INSTANCE_ID" ] || [ "$INSTANCE_ID" = "None" ]; then
            echo "==> ERROR: No running EC2 instance found for $SERVER_NAME in $AWS_REGION."
            exit 1
          fi

          echo "==> Waiting for SSM agent on instance $INSTANCE_ID in $AWS_REGION..."
          PING="Offline"
          for i in $(seq 1 36); do
            PING=$(aws ssm describe-instance-information \
              --region "$AWS_REGION" \
              --filters "Key=InstanceIds,Values=$INSTANCE_ID" \
              --query "InstanceInformationList[0].PingStatus" \
              --output text 2>/dev/null || true)
            echo "SSM Ping [$i/36]: $PING"
            if [ "$PING" = "Online" ]; then
              break
            fi
            sleep 10
          done

          if [ "$PING" != "Online" ]; then
            echo "==> SSM agent is not Online (status: $PING). Checking if instance is still booting..."
            aws ec2 describe-instances --region "$AWS_REGION" --instance-ids "$INSTANCE_ID" --query "Reservations[0].Instances[0].State.Name" --output text 2>/dev/null || true
            echo "==> Aborting deploy due to SSM agent unreachable."
            exit 1
          fi

          # Write the SSM command payload to a JSON file — this avoids
          # ALL shell quoting issues from embedding a JSON array of
          # double-quoted strings inside a double-quoted CLI argument.
          cat > /tmp/ssm-params.json << SSMPARAMS
          {
            "commands": [
              "echo '==> Synchronizing cloud-init provisioning...' && (cloud-init status --wait 2>/dev/null || true)",
              "systemctl start docker 2>/dev/null || service docker start 2>/dev/null || true",
              "until docker info > /dev/null 2>&1; do sleep 2; done",
              "aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_REGISTRY",
              "docker pull $FULL_IMAGE",
              "docker stop app 2>/dev/null || true",
              "docker rm app 2>/dev/null || true",
              "aws secretsmanager get-secret-value --region $AWS_REGION --secret-id $SECRET_ID --query SecretString --output text | python3 -c \"import sys,json; [print(k, v, sep=chr(61)) for k, v in json.load(sys.stdin).items()]\" > /home/ubuntu/app.env 2>/dev/null || touch /home/ubuntu/app.env",
              "docker run -d --restart always -p 80:$TARGET_PORT -e HOSTNAME=0.0.0.0 --env-file /home/ubuntu/app.env --name app $FULL_IMAGE",
              "sleep 4",
              "docker ps --filter name=app --format 'table {{.Names}}	{{.Status}}	{{.Ports}}'"
            ]
          }
          SSMPARAMS

          echo "==> Sending SSM deployment command to instance $INSTANCE_ID..."
          CMD_ID=$(aws ssm send-command \
            --region "$AWS_REGION" \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/ssm-params.json \
            --query "Command.CommandId" \
            --output text)
          echo "SSM CommandId: $CMD_ID"

          echo "==> Polling command status..."
          for i in $(seq 1 36); do
            sleep 5
            STATUS=$(aws ssm get-command-invocation \
              --region "$AWS_REGION" \
              --command-id "$CMD_ID" \
              --instance-id "$INSTANCE_ID" \
              --query "Status" \
              --output text 2>/dev/null || true)
            echo "Status [$i/36]: $STATUS"
            if [ "$STATUS" = "Success" ]; then
              echo "==> Deployment successfully finished on instance!"
              exit 0
            fi
            if [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
              echo "==> SSM Command Failed!"
              aws ssm get-command-invocation \
                --region "$AWS_REGION" \
                --command-id "$CMD_ID" \
                --instance-id "$INSTANCE_ID" \
                --query "StandardErrorContent" \
                --output text 2>/dev/null || true
              exit 1
            fi
          done
          echo "==> Timed out waiting for SSM command execution."
          exit 1

      - name: Verify Live Application Health
        env:
          PUBLIC_IP: ${{ env.PUBLIC_IP }}
          TARGET_PORT: ${{ env.TARGET_PORT }}
        run: |
          echo "==> Verifying live service health on public endpoint..."
          PROBE_HOST="${PUBLIC_IP:-13.205.31.35}"
          if [ -z "$PROBE_HOST" ] || [ "$PROBE_HOST" = "None" ]; then
            echo "==> No public IP or domain configured; skipping external HTTP probe."
            exit 0
          fi

          echo "==> Probing http://$PROBE_HOST/..."
          for h in $(seq 1 18); do
            sleep 5
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 6 "http://$PROBE_HOST/" 2>/dev/null || true)
            echo "Health probe [$h/18]: HTTP $HTTP_CODE"
            if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "301" ] || [ "$HTTP_CODE" = "302" ]; then
              echo "==> Live health check PASSED (HTTP $HTTP_CODE) at http://$PROBE_HOST/"
              exit 0
            fi
          done
          echo "==> Container was launched on EC2. External HTTP probe returned HTTP $HTTP_CODE (may still be initializing)."
          exit 0
