name: Build & Deploy to EC2 Docker

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      REGION: ap-south-1
      ECR_REGISTRY: 759204735992.dkr.ecr.ap-south-1.amazonaws.com
      ECR_REPOSITORY: vimix
      INSTANCE_ID: i-09cb51a6f25842967
      PUBLIC_URL: http://15.207.49.159
      CONTAINER_PORT: 80

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        id: build-push
        env:
          ECR_REGISTRY: ${{ env.ECR_REGISTRY }}
          ECR_REPOSITORY: ${{ env.ECR_REPOSITORY }}
        run: |
          set -e
          IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}"
          echo "Full image URI: ${IMAGE_URI}"
          echo "Building ${IMAGE_URI}:${GITHUB_SHA} (and :latest) ..."
          docker build \
            --tag "${IMAGE_URI}:${GITHUB_SHA}" \
            --tag "${IMAGE_URI}:latest" \
            .
          echo "Pushing tags..."
          docker push "${IMAGE_URI}:${GITHUB_SHA}"
          docker push "${IMAGE_URI}:latest"
          echo "image_uri=${IMAGE_URI}" >> "$GITHUB_OUTPUT"

      - name: Deploy to EC2 via SSM
        env:
          REGION: ${{ env.REGION }}
          INSTANCE_ID: ${{ env.INSTANCE_ID }}
          IMAGE_URI: ${{ steps.build-push.outputs.image_uri }}:latest
          ECR_REGISTRY: ${{ env.ECR_REGISTRY }}
        run: |
          set -e
          # write the SSM command payload to a temporary file
          cat > /tmp/ssm-params.json << EOF
          {
            "commands": [
              "aws ecr get-login-password --region $REGION | docker login --username AWS --password-stdin $ECR_REGISTRY",
              "docker pull $IMAGE_URI",
              "docker stop app || true",
              "docker rm app || true",
              "docker run -d --restart always -p ${CONTAINER_PORT}:${CONTAINER_PORT} --name app $IMAGE_URI"
            ]
          }
          EOF

          # send the command
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --region "$REGION" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/ssm-params.json \
            --query "Command.CommandId" \
            --output text)

          echo "SSM command sent, ID: $COMMAND_ID"

          # wait for command to finish
          echo "Waiting for SSM command to complete..."
          while true; do
            STATUS=$(aws ssm list-command-invocations \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --region "$REGION" \
              --details \
              --query "CommandInvocations[0].Status" \
              --output text)
            echo "Current status: $STATUS"
            if [[ "$STATUS" == "Success" ]]; then
              echo "Deployment command succeeded."
              break
            elif [[ "$STATUS" == "Failed" || "$STATUS" == "Cancelled" || "$STATUS" == "TimedOut" ]]; then
              echo "Deployment command failed with status $STATUS."
              exit 1
            else
              sleep 5
            fi
          done

      - name: Verify deployment (HTTP 200)
        env:
          PUBLIC_URL: ${{ env.PUBLIC_URL }}
        run: |
          set -e
          echo "Waiting for the service to become reachable at $PUBLIC_URL ..."
          for i in $(seq 1 30); do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$PUBLIC_URL" || echo "000")
            if [ "$HTTP_CODE" = "200" ]; then
              echo "✅ Service responded with HTTP 200."
              exit 0
            else
              echo "Attempt $i: HTTP $HTTP_CODE – retrying in 10s..."
              sleep 10
            fi
          done
          echo "❌ Service did not return HTTP 200 after multiple attempts."
          exit 1