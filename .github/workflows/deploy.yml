name: Deploy Vimix CRM to EC2 Docker

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: ap-south-1
  ECR_REGISTRY: 759204735992.dkr.ecr.ap-south-1.amazonaws.com
  ECR_REPOSITORY: vimix
  INSTANCE_ID: i-037c138adf0855d67
  PUBLIC_URL: http://13.234.210.33
  SECRETS_MANAGER_ID: deptic/vimix/secrets
  CONTAINER_PORT: "5000"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image_uri: ${{ steps.image.outputs.image_uri }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        run: |
          export AWS_ACCESS_KEY_ID="${{ secrets.AWS_ACCESS_KEY_ID }}"
          export AWS_SECRET_ACCESS_KEY="${{ secrets.AWS_SECRET_ACCESS_KEY }}"
          export AWS_DEFAULT_REGION="${AWS_REGION}"
          aws sts get-caller-identity

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute image URI
        id: image
        run: echo "image_uri=$ECR_REGISTRY/$ECR_REPOSITORY:${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

      - name: Login to ECR
        run: |
          export AWS_ACCESS_KEY_ID="${{ secrets.AWS_ACCESS_KEY_ID }}"
          export AWS_SECRET_ACCESS_KEY="${{ secrets.AWS_SECRET_ACCESS_KEY }}"
          export AWS_DEFAULT_REGION="${AWS_REGION}"
          aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"

      - name: Build image
        run: |
          docker build -t "$IMAGE_URI" -f Dockerfile . 2>&1 | tee /tmp/build.log || { echo "::error::Docker build failed"; tail -100 /tmp/build.log; exit 1; }
        env:
          IMAGE_URI: ${{ steps.image.outputs.image_uri }}

      - name: Push image
        run: |
          export AWS_ACCESS_KEY_ID="${{ secrets.AWS_ACCESS_KEY_ID }}"
          export AWS_SECRET_ACCESS_KEY="${{ secrets.AWS_SECRET_ACCESS_KEY }}"
          export AWS_DEFAULT_REGION="${AWS_REGION}"
          docker push "$IMAGE_URI"
        env:
          IMAGE_URI: ${{ steps.image.outputs.image_uri }}

  deploy-and-verify:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Configure AWS credentials
        run: |
          export AWS_ACCESS_KEY_ID="${{ secrets.AWS_ACCESS_KEY_ID }}"
          export AWS_SECRET_ACCESS_KEY="${{ secrets.AWS_SECRET_ACCESS_KEY }}"
          export AWS_DEFAULT_REGION="${AWS_REGION}"
          aws sts get-caller-identity

      - name: Fetch runtime secrets
        run: |
          export AWS_ACCESS_KEY_ID="${{ secrets.AWS_ACCESS_KEY_ID }}"
          export AWS_SECRET_ACCESS_KEY="${{ secrets.AWS_SECRET_ACCESS_KEY }}"
          export AWS_DEFAULT_REGION="${AWS_REGION}"
          SECRET_JSON=$(aws secretsmanager get-secret-value --secret-id "$SECRETS_MANAGER_ID" --query SecretString --output text)
          echo "MONGODB_URI=$(echo "$SECRET_JSON" | jq -r '.MONGODB_URI // empty')" >> /tmp/secret.env
          echo "JWT_SECRET=$(echo "$SECRET_JSON" | jq -r '.JWT_SECRET // empty')" >> /tmp/secret.env
          echo "REDIS_URL=$(echo "$SECRET_JSON" | jq -r '.REDIS_URL // empty')" >> /tmp/secret.env
          if [ ! -s /tmp/secret.env ]; then echo "::error::No runtime secrets resolved"; exit 1; fi

      - name: Deploy via SSM
        run: |
          export AWS_ACCESS_KEY_ID="${{ secrets.AWS_ACCESS_KEY_ID }}"
          export AWS_SECRET_ACCESS_KEY="${{ secrets.AWS_SECRET_ACCESS_KEY }}"
          export AWS_DEFAULT_REGION="${AWS_REGION}"
          IMAGE_URI="${{ needs.build-and-push.outputs.image_uri }}"
          {
            echo '{ "commands": ['
            echo "\"export MONGODB_URI='$(sed -n 's/^MONGODB_URI=//p' /tmp/secret.env)',\" | sed 's/,$//' > /tmp/envline && true\" 2>/dev/null," || true
            echo "] }"
          } > /dev/null
          cat > /tmp/ssm-params.json << SSMPARAMS
          {
            "commands": [
              "aws ecr get-login-password --region ${AWS_REGION} | docker login --username AWS --password-stdin ${ECR_REGISTRY}",
              "docker pull ${IMAGE_URI}",
              "docker stop app || true",
              "docker rm app || true",
              "docker run -d --restart always -p 80:80 --name app --env PORT=${CONTAINER_PORT} --env NODE_ENV=production --env MONGODB_URI='$(sed -n 's/^MONGODB_URI=//p' /tmp/secret.env)' --env JWT_SECRET='$(sed -n 's/^JWT_SECRET=//p' /tmp/secret.env)' --env REDIS_URL='$(sed -n 's/^REDIS_URL=//p' /tmp/secret.env)' --env VITE_API_URL= --env UPLOAD_DIR=/app/uploads ${IMAGE_URI}"
            ]
          }
          SSMPARAMS
          COMMAND_ID=$(aws ssm send-command --instance-ids "${INSTANCE_ID}" --region "${AWS_REGION}" --document-name "AWS-RunShellScript" --parameters file:///tmp/ssm-params.json --query "Command.CommandId" --output text)
          for i in $(seq 1 30); do
            STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "${INSTANCE_ID}" --region "${AWS_REGION}" --query Status --output text)
            echo "SSM status: $STATUS"
            [ "$STATUS" = "Success" ] && break
            [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ] && { aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "${INSTANCE_ID}" --region "${AWS_REGION}" --output json; exit 1; }
            sleep 10
          done
          [ "$STATUS" = "Success" ] || { echo "::error::SSM deploy did not succeed"; exit 1; }

      - name: Health check (HTTP 200 required)
        run: |
          for i in $(seq 1 30); do
            CODE=$(curl -s -o /tmp/health.json -w "%{http_code}" "${PUBLIC_URL}/health" || echo 000)
            echo "Attempt $i: /health -> $CODE"
            if [ "$CODE" = "200" ]; then cat /tmp/health.json; echo "Deployment healthy"; exit 0; fi
            sleep 10
          done
          echo "::error::Health check failed after 30 attempts"
          exit 1