name: Build and Deploy to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: vimix-crm
  CONTAINER_NAME: app

jobs:
  build-and-push:
    name: Build and Push Image
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Compute image tag
        id: image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: echo "image=${REGISTRY}/${ECR_REPOSITORY}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build image
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: docker build -t "$IMAGE" .

      - name: Smoke test built image
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          docker run -d --name smoke -p 8080:80 "$IMAGE"
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/ > /dev/null; then echo "Smoke test passed"; break; fi
            sleep 2
          done
          docker rm -f smoke

      - name: Push image
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: docker push "$IMAGE"

  deploy:
    name: Deploy to EC2
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy container via SSM
        env:
          IMAGE: ${{ needs.build-and-push.outputs.image }}
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
        run: |
          COMMANDS="
            aws ecr get-login-password --region ${AWS_REGION} | docker login --username AWS --password-stdin $(echo $IMAGE | cut -d/ -f1)
            docker pull ${IMAGE}
            docker rm -f ${CONTAINER_NAME} 2>/dev/null || true
            docker run -d --name ${CONTAINER_NAME} --restart unless-stopped \\
              -p 80:80 \\
              -e NODE_ENV=production \\
              -e PORT=5000 \\
              -e MONGODB_URI=\"${{ secrets.MONGODB_URI }}\" \\
              -e JWT_SECRET=\"${{ secrets.JWT_SECRET }}\" \\
              -v /home/ec2-user/uploads:/usr/src/app/uploads \\
              ${IMAGE}
            docker ps
          "
          aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy vimix app" \
            --parameters commands="$COMMANDS" \
            --output text --query 'Command.CommandId' > command_id.txt
          COMMAND_ID=$(cat command_id.txt)
          for i in $(seq 1 30); do
            STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query Status --output text)
            echo "SSM status: $STATUS"
            [ "$STATUS" = "Success" ] && exit 0
            [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ] && {
              aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query '{Stdout:StandardOutputContent,Stderr:StandardErrorContent}' --output text
              exit 1
            }
            sleep 5
          done
          echo "SSM command timed out"; exit 1

  health-check:
    name: Health Check
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify container is healthy
        env:
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Health check" \
            --parameters 'commands=["docker inspect -f ""{{.State.Status}}"" app","curl -fsS http://127.0.0.1/health || (docker logs app --tail 50; exit 1)"]' \
            --output text --query 'Command.CommandId')
          for i in $(seq 1 20); do
            STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query Status --output text)
            [ "$STATUS" = "Success" ] && exit 0
            [ "$STATUS" = "Failed" ] && { aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query StandardErrorContent --output text; exit 1; }
            sleep 5
          done
          exit 1
