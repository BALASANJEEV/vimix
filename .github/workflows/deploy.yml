name: Build & Deploy Vimix CRM to EC2 Docker

on:
  push:
    branches: ["main"]
  workflow_dispatch:

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: vimix
  INSTANCE_ID: i-002ecb281bdf403cd
  SERVER_NAME: vimix-server
  PUBLIC_URL: http://13.232.139.188
  DOCKERFILE_PATH: .
  SECRET_ID: deptic/vimix/secrets

jobs:
  build-deploy:
    name: Build, Push and Deploy
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ap-south-1
      AWS_REGION: ap-south-1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Dockerfile exists
        run: |
          set -e
          test -f Dockerfile || { echo "Dockerfile not found at repository root"; exit 1; }
          echo "==> Dockerfile found at repository root"

      - name: Login to Amazon ECR
        id: login-ecr
        run: |
          set -e
          ECR_REGISTRY="759204735992.dkr.ecr.ap-south-1.amazonaws.com"
          aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"
          echo "registry=$ECR_REGISTRY" >> "$GITHUB_OUTPUT"

      - name: Build, tag, and push Docker image to ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          set -e
          FULL_IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY"
          echo "==> Building $FULL_IMAGE:latest from context: ."
          docker build \
            --build-arg VITE_API_URL="" \
            --tag "$FULL_IMAGE:$GITHUB_SHA" \
            --tag "$FULL_IMAGE:latest" \
            --file Dockerfile .
          echo "==> Pushing $FULL_IMAGE:$GITHUB_SHA"
          docker push "$FULL_IMAGE:$GITHUB_SHA"
          echo "==> Pushing $FULL_IMAGE:latest"
          docker push "$FULL_IMAGE:latest"
          echo "full_image=$FULL_IMAGE" >> "$GITHUB_OUTPUT"

      - name: Deploy to EC2 via SSM
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          set -e
          REGION="ap-south-1"
          INSTANCE_ID="i-002ecb281bdf403cd"
          SECRET_ID="deptic/vimix/secrets"
          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:latest"

          # Inject runtime secrets from Secrets Manager into the container
          export_envs=$(aws secretsmanager get-secret-value \
            --secret-id "$SECRET_ID" \
            --region "$REGION" \
            --query SecretString --output text | \
            python3 -c 'import sys,json;s=json.load(sys.stdin);print(" ".join(f"-e {k}=\"{v}\"" for k,v in s.items() if k in ("NODE_ENV","PORT","MONGODB_URI","JWT_SECRET","FRONTEND_ORIGIN","REDIS_URL","UPLOAD_DIR","ALLOW_PUBLIC_SIGNUP")))')

          cat > /tmp/ssm-params.json << SSMPARAMS
          {
            "commands": [
              "set -e",
              "aws ecr get-login-password --region $REGION | docker login --username AWS --password-stdin $ECR_REGISTRY",
              "docker pull $IMAGE_URI",
              "docker stop app || true",
              "docker rm app || true",
              "docker run -d --restart always -p 80:80 --name app $export_envs $IMAGE_URI",
              "docker ps --filter name=app --format '{{.ID}} {{.Status}}'"
            ]
          }
          SSMPARAMS

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --region "$REGION" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy vimix image $GITHUB_SHA" \
            --parameters file:///tmp/ssm-params.json \
            --query "Command.CommandId" --output text)

          echo "==> Waiting for SSM command $COMMAND_ID..."
          aws ssm wait command-executed --instance-id "$INSTANCE_ID" --command-id "$COMMAND_ID" --region "$REGION" || true
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --region "$REGION" \
            --query "{Status:Status,Output:Output,Error:StandardErrorContent}" --output text

      - name: Health check (must return HTTP 200)
        run: |
          set -e
          URL="http://13.232.139.188/health"
          echo "==> Verifying $URL"
          for i in $(seq 1 15); do
            STATUS=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$URL" || true)
            echo "Attempt $i: HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "Deployment verified: health endpoint returned HTTP 200."
              exit 0
            fi
            sleep 15
          done
          echo "Health check failed after retries."
          exit 1