name: Deploy to ECS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      ECR_REPO: ${{ secrets.ECR_REPO }} # ECR repository name, e.g., my-app
      ECS_CLUSTER: ${{ secrets.ECS_CLUSTER }}
      ECS_SERVICE: ${{ secrets.ECS_SERVICE }}
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        run: |
          docker build -t $ECR_REPO:$IMAGE_TAG .
          docker push $ECR_REPO:$IMAGE_TAG

      - name: Retrieve AWS account ID
        id: acct
        run: |
          echo "AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)" >> $GITHUB_OUTPUT

      - name: Generate task definition with image reference
        run: |
          # Replace placeholders in ecs-task-def.json and write to temp file
          cp ecs-task-def.json task-def.json
          sed -i "s|${AWS_ACCOUNT_ID}|${{ steps.acct.outputs.AWS_ACCOUNT_ID }}|g" task-def.json
          sed -i "s|${IMAGE_URI}|${ECR_REPO}:${IMAGE_TAG}|g" task-def.json

      - name: Register task definition
        run: |
          aws ecs register-task-definition --cli-input-json file://task-def.json
          echo "Registering task definition completed."

      - name: Update ECS service to deploy new task
        run: |
          aws ecs update-service \
            --cluster $ECS_CLUSTER \
            --service $ECS_SERVICE \
            --force-new-deployment
        env:
          AWS_REGION: ${{ env.AWS_REGION }}
