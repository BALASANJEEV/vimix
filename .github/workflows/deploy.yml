name: Deploy Vimix CRM to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGION: ap-south-1
  ECR_REGISTRY: 759204735992.dkr.ecr.ap-south-1.amazonaws.com
  ECR_REPOSITORY: vimix
  INSTANCE_ID: i-05619e2578f489196
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::759204735992:role/vimix-ec2-role
          aws-region: ${{ env.REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:latest
          build-args: |
            VITE_API_URL=
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::759204735992:role/vimix-ec2-role
          aws-region: ${{ env.REGION }}

      - name: Deploy and verify on EC2
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          FRONTEND_ORIGIN: http://13.206.171.10
          PUBLIC_URL: http://13.206.171.10
        run: |
          set -euo pipefail

          : "${MONGODB_URI:?GitHub secret MONGODB_URI is required}"
          : "${JWT_SECRET:?GitHub secret JWT_SECRET is required}"
          : "${REDIS_URL:?GitHub secret REDIS_URL is required}"

          FULL_IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

          cat > /tmp/ssm-params.json << 'SSMPARAMS'
          {
            "commands": [
              "mkdir -p /etc/vimix",
              "echo 'NODE_ENV=production' > /etc/vimix/app.env",
              "echo 'PORT=5000' >> /etc/vimix/app.env",
              "echo 'MONGODB_URI=$MONGODB_URI' >> /etc/vimix/app.env",
              "echo 'JWT_SECRET=$JWT_SECRET' >> /etc/vimix/app.env",
              "echo 'REDIS_URL=$REDIS_URL' >> /etc/vimix/app.env",
              "echo 'FRONTEND_ORIGIN=$FRONTEND_ORIGIN' >> /etc/vimix/app.env",
              "echo 'UPLOAD_DIR=/app/backend/uploads' >> /etc/vimix/app.env",
              "echo 'ALLOW_PUBLIC_SIGNUP=false' >> /etc/vimix/app.env",
              "aws ecr get-login-password --region $REGION | docker login --username AWS --password-stdin $ECR_REGISTRY",
              "docker pull $FULL_IMAGE",
              "docker stop app 2>/dev/null || true",
              "docker rm app 2>/dev/null || true",
              "docker run -d --restart always --name app -p 80:80 --env-file /etc/vimix/app.env -v vimix-uploads:/app/backend/uploads $FULL_IMAGE",
              "sleep 10",
              "curl -sf http://127.0.0.1/health/ready && echo 'Health check passed'"
            ]
          }
          SSMPARAMS

          sed -i "s|\$MONGODB_URI|$MONGODB_URI|g; s|\$JWT_SECRET|$JWT_SECRET|g; s|\$REDIS_URL|$REDIS_URL|g; s|\$FRONTEND_ORIGIN|$FRONTEND_ORIGIN|g; s|\$REGION|$REGION|g; s|\$ECR_REGISTRY|$ECR_REGISTRY|g; s|\$FULL_IMAGE|$FULL_IMAGE|g" /tmp/ssm-params.json

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --region "$REGION" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/ssm-params.json \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          # Wait up to 120 seconds for the SSM command to complete
          for i in $(seq 1 24); do
            STATUS=$(aws ssm list-command-invocations \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --region "$REGION" \
              --query "CommandInvocations[0].Status" \
              --output text)
            if [ "$STATUS" = "Success" ]; then
              echo "Deployment succeeded"
              break
            elif [ "$STATUS" = "Failed" ] || [ "$STATUS" = "TimedOut" ]; then
              echo "Deployment failed with status: $STATUS"
              aws ssm list-command-invocations \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --region "$REGION" \
                --query "CommandInvocations[0].CommandPlugins[0].Output" \
                --output text
              exit 1
            fi
            echo "Waiting for SSM command to complete... attempt $i/24"
            sleep 5
          done

      - name: Verify deployed application health
        run: |
          sleep 10
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://13.206.171.10/health/ready || true)
          if [ "$HTTP_CODE" = "200" ]; then
            echo "Application health check passed (HTTP $HTTP_CODE)"
            curl -s http://13.206.171.10/health/ready | head -c 200
            echo ""
          else
            echo "Health check failed with HTTP $HTTP_CODE"
            curl -v http://13.206.171.10/health/ready 2>&1 || true
            exit 1
          fi