name: Build and Deploy Vimix CRM to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: ap-south-1
  ECR_REGISTRY: 759204735992.dkr.ecr.ap-south-1.amazonaws.com
  ECR_REPOSITORY: vimix
  INSTANCE_ID: i-088e488f3bf9bf763
  BACKEND_IMAGE_TAG: backend-${{ github.sha }}
  FRONTEND_IMAGE_TAG: frontend-${{ github.sha }}

jobs:
  build:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::759204735992:role/vimix-ec2-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./vimix-crm-backend
          file: ./vimix-crm-backend/Dockerfile
          push: true
          tags: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ env.BACKEND_IMAGE_TAG }},${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:backend-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./vimix-crm-frontend
          file: ./vimix-crm-frontend/Dockerfile
          push: true
          tags: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ env.FRONTEND_IMAGE_TAG }},${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:frontend-latest
          build-args: |
            VITE_API_URL=
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::759204735992:role/vimix-ec2-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Run SSM commands to deploy on EC2
        shell: bash
        run: |
          REGION="${{ env.AWS_REGION }}"
          INSTANCE_ID="${{ env.INSTANCE_ID }}"
          ECR_REGISTRY="${{ env.ECR_REGISTRY }}"
          ECR_REPOSITORY="${{ env.ECR_REPOSITORY }}"
          BACKEND_TAG="${{ env.BACKEND_IMAGE_TAG }}"
          FRONTEND_TAG="${{ env.FRONTEND_IMAGE_TAG }}"
          BACKEND_IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY:$BACKEND_TAG"
          FRONTEND_IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY:$FRONTEND_TAG"
          SECRETS_ID="deptic/vimix/secrets"

          cat > /tmp/ssm-params.json << 'SSMPARAMS'
          {
            "commands": [
              "set -e",
              "REGION=$(echo $AWS_REGION)",
              "INSTANCE_ID=$(echo $INSTANCE_ID)",
              "ECR_REGISTRY=$(echo $ECR_REGISTRY)",
              "ECR_REPOSITORY=$(echo $ECR_REPOSITORY)",
              "BACKEND_IMAGE=$(echo $BACKEND_IMAGE)",
              "FRONTEND_IMAGE=$(echo $FRONTEND_IMAGE)",
              "SECRETS_ID=$(echo $SECRETS_ID)",
              "aws ecr get-login-password --region $REGION | docker login --username AWS --password-stdin $ECR_REGISTRY",
              "docker pull $BACKEND_IMAGE",
              "docker pull $FRONTEND_IMAGE",
              "docker stop backend || true",
              "docker rm backend || true",
              "docker stop frontend || true",
              "docker rm frontend || true",
              "aws secretsmanager get-secret-value --secret-id $SECRETS_ID --region $REGION --query SecretString --output text > /tmp/secrets.json",
              "export JWT_SECRET=$(cat /tmp/secrets.json | jq -r '.JWT_SECRET')",
              "export MONGODB_URI=$(cat /tmp/secrets.json | jq -r '.MONGODB_URI')",
              "export MONGO_URI=$(cat /tmp/secrets.json | jq -r '.MONGO_URI')",
              "export REDIS_URL=$(cat /tmp/secrets.json | jq -r '.REDIS_URL')",
              "export FRONTEND_PORT=9001",
              "export VITE_API_URL=$(cat /tmp/secrets.json | jq -r '.VITE_API_URL')",
              "export FRONTEND_ORIGIN=http://13.201.233.85",
              "docker run -d --restart always -p 5000:5000 -p 80:80 --name backend \\",
              "  -e JWT_SECRET=$JWT_SECRET \\",
              "  -e MONGODB_URI=$MONGODB_URI \\",
              "  -e MONGO_URI=$MONGO_URI \\",
              "  -e REDIS_URL=$REDIS_URL \\",
              "  -e PORT=5000 \\",
              "  -e FRONTEND_ORIGIN=$FRONTEND_ORIGIN \\",
              "  -e NODE_ENV=production \\",
              "  -e UPLOAD_DIR=/app/uploads \\",
              "  $BACKEND_IMAGE",
              "docker run -d --restart always -p 80:80 \\",
              "  -e VITE_API_URL=$VITE_API_URL \\",
              "  --name frontend \\",
              "  $FRONTEND_IMAGE",
              "rm -f /tmp/secrets.json"
            ]
          }
          SSMPARAMS

          aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --region "$REGION" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/ssm-params.json \
            --output text \
            --query "Command.CommandId"