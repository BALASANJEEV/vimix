name: Deploy to ECS

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2
        with:
          mask-password: 'true'

      - name: Build and push Docker image
        env:
          ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com
          IMAGE_NAME: vimix
        run: |
          docker build -t $ECR_REGISTRY/$IMAGE_NAME:latest .
          docker push $ECR_REGISTRY/$IMAGE_NAME:latest

      - name: Run ECS task
        uses: aws-actions/amazon-ecs-run-task@v1
        with:
          task-definition: vimix-task
          cluster: vimix-cluster
          wait-for-finished: true
          launch-type: FARGATE
          platform-version: LATEST
          network-configuration: |
            awsvpcConfiguration={
              subnets=${{ secrets.SUBNET_IDS }},
              securityGroups=${{ secrets.SECURITY_GROUP_IDS }},
              assignPublicIp=ENABLED
            }