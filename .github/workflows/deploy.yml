name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Grant the workflow permission to request an OIDC token for role assumption
permissions:
  contents: read
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Configure AWS credentials via OIDC role assumption
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-south-1
          # Output the assumed credentials as environment variables for later steps
          output-env-credentials: true

      # Log in to Amazon ECR
      - name: Login to Amazon ECR
        id: ecr_login
        run: |
          aws ecr get-login-password --region ${{ env.AWS_REGION }} |
          docker login --username AWS --password-stdin ${{ env.ECR_REPO_URI }}
        env:
          AWS_REGION: ap-south-1
          ECR_REPO_URI: 759204735992.dkr.ecr.ap-south-1.amazonaws.com/vimix

      # Build the Docker image
      - name: Build Docker image
        run: |
          docker build -t ${{ env.ECR_REPO_URI }}:latest .
        env:
          ECR_REPO_URI: 759204735992.dkr.ecr.ap-south-1.amazonaws.com/vimix

      # Push the Docker image to ECR
      - name: Push Docker image to ECR
        run: |
          docker push ${{ env.ECR_REPO_URI }}:latest
        env:
          ECR_REPO_URI: 759204735992.dkr.ecr.ap-south-1.amazonaws.com/vimix

      # Deploy the image to the EC2 instance (example using SSM Run Command)
      - name: Deploy to EC2 via SSM
        uses: aws-actions/amazon-ecs-run-task@v1 # replace with your actual deployment method
        with:
          cluster: your-ecs-cluster-name # if using ECS, otherwise replace with your own deployment step
          task-definition: your-task-def
          launch-type: FARGATE
          network-configuration: awsvpcConfiguration={subnets=[subnet-xxxxxx],securityGroups=[sg-xxxxxx],assignPublicIp=ENABLED}
          wait-for-service-stability: true
        env:
          AWS_REGION: ap-south-1

      # Optional: Invalidate CloudFront cache or any post‑deployment cleanup
      - name: Post‑deployment actions
        run: echo "Deployment completed successfully."
