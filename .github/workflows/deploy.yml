name: Build & Deploy to EC2 Docker

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      REGION: ap-south-1
      ECR_REPOSITORY_URI: 759204735992.dkr.ecr.ap-south-1.amazonaws.com/vimix
      INSTANCE_ID: i-09cb51a6f25842967
      PUBLIC_URL: http://15.207.49.159
      CONTAINER_PORT: 80

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        id: build-push
        env:
          ECR_REPOSITORY_URI: ${{ env.ECR_REPOSITORY_URI }}
        run: |
          set -e
          IMAGE_URI="${ECR_REPOSITORY_URI}"
          echo "Building image ${IMAGE_URI}:${GITHUB_SHA} and ${IMAGE_URI}:latest"
          docker build \
            --file Dockerfile \
            --tag "${IMAGE_URI}:${GITHUB_SHA}" \
            --tag "${IMAGE_URI}:latest" \
            .

          echo "Pushing image tags..."
          docker push "${IMAGE_URI}:${GITHUB_SHA}"
          docker push "${IMAGE_URI}:latest"

          echo "image_uri=${IMAGE_URI}" >> "$GITHUB_OUTPUT"

      - name: Deploy to EC2 via SSM
        env:
          REGION: ${{ env.REGION }}
          INSTANCE_ID: ${{ env.INSTANCE_ID }}
          IMAGE_URI: ${{ steps.build-push.outputs.image_uri }}:latest
          ECR_REPOSITORY_URI: ${{ env.ECR_REPOSITORY_URI }}
        run: |
          set -e
          cat > /tmp/ssm-params.json << EOF
          {
            "commands": [
              "aws ecr get-login-password --region $REGION | docker login --username AWS --password-stdin $ECR_REPOSITORY_URI",
              "docker pull $IMAGE_URI",
              "docker stop app || true",
              "docker rm app || true",
              "docker run -d --restart always -p ${CONTAINER_PORT}:${CONTAINER_PORT} --name app $IMAGE_URI"
            ]
          }
          EOF

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --region "$REGION" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/ssm-params.json \
            --query "Command.CommandId" \
            --output text)

          echo "SSM command sent (ID: $COMMAND_ID). Waiting for completion..."

          while true; do
            STATUS=$(aws ssm list-command-invocations \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --region "$REGION" \
              --details \
              --query "CommandInvocations[0].Status" \
              --output text)
            echo "Current SSM status: $STATUS"
            if [[ "$STATUS" == "Success" ]]; then
              echo "Deployment succeeded."
              break
            elif [[ "$STATUS" == "Failed" || "$STATUS" == "Cancelled" || "$STATUS" == "TimedOut" ]]; then
              echo "Deployment failed with status $STATUS."
              exit 1
            else
              sleep 5
            fi
          done

      - name: Wait for service readiness
        env:
          PUBLIC_URL: ${{ env.PUBLIC_URL }}
        run: |
          set -e
          echo "Waiting for HTTP 200 on ${PUBLIC_URL}/health ..."
          for i in {1..30}; do
            HTTP_CODE=$(curl -o /dev/null -s -w "%{http_code}" "${PUBLIC_URL}/health" || echo "000")
            if [[ "$HTTP_CODE" == "200" ]]; then
              echo "Health check passed."
              exit 0
            fi
            echo "Attempt $i: received $HTTP_CODE, retrying in 5s..."
            sleep 5
          done
          echo "Health check failed after multiple attempts."
          exit 1