name: Build and Deploy to EC2 Docker

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: vimix
  INSTANCE_ID: i-0b95f619434abdcd6
  ECR_REGISTRY: 759204735992.dkr.ecr.ap-south-1.amazonaws.com
  PUBLIC_URL: http://15.207.145.62
  SECRETS_MANAGER_ID: deptic/vimix/secrets

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build image (with diagnostics)
        run: |
          set -x
          docker version
          docker build \
            --progress=plain \
            -t vimix:ci \
            -f Dockerfile .
          docker images vimix:ci

      - name: Push image
        run: |
          set -x
          ECR_REGISTRY="759204735992.dkr.ecr.ap-south-1.amazonaws.com"
          ECR_REPOSITORY="vimix"
          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:latest"
          IMAGE_SHA="$ECR_REGISTRY/$ECR_REPOSITORY:${GITHUB_SHA::12}"
          docker tag vimix:ci "$IMAGE_URI"
          docker tag vimix:ci "$IMAGE_SHA"
          docker push "$IMAGE_URI"
          docker push "$IMAGE_SHA"
          echo "IMAGE_URI=$IMAGE_SHA" >> "$GITHUB_ENV"

      - name: Deploy via SSM
        run: |
          set -x
          REGION="ap-south-1"
          INSTANCE_ID="i-0b95f619434abdcd6"
          ECR_REGISTRY="759204735992.dkr.ecr.ap-south-1.amazonaws.com"
          ECR_REPOSITORY="vimix"
          IMAGE_URI="${{ env.IMAGE_URI }}"
          SECRETS_MANAGER_ID="deptic/vimix/secrets"
          cat > /tmp/ssm-params.json << SSMPARAMS
          {
            "commands": [
              "set -x",
              "export AWS_DEFAULT_REGION=$REGION",
              "aws ecr get-login-password --region $REGION | docker login --username AWS --password-stdin $ECR_REGISTRY",
              "docker pull $IMAGE_URI",
              "docker stop app || true",
              "docker rm app || true",
              "SECRETS=\$(aws secretsmanager get-secret-value --secret-id $SECRETS_MANAGER_ID --region $REGION --query SecretString --output text)",
              "JWT_SECRET=\$(echo \"\$SECRETS\" | jq -r '.JWT_SECRET')",
              "MONGODB_URI=\$(echo \"\$SECRETS\" | jq -r '.MONGODB_URI')",
              "REDIS_URL=\$(echo \"\$SECRETS\" | jq -r '.REDIS_URL // empty')",
              "FRONTEND_ORIGIN=\$(echo \"\$SECRETS\" | jq -r '.FRONTEND_ORIGIN // \"http://15.207.145.62\"')",
              "docker run -d --restart always -p 80:80 --name app -e PORT=5000 -e NODE_ENV=production -e JWT_SECRET=\"\$JWT_SECRET\" -e MONGODB_URI=\"\$MONGODB_URI\" -e REDIS_URL=\"\$REDIS_URL\" -e FRONTEND_ORIGIN=\"\$FRONTEND_ORIGIN\" -e UPLOAD_DIR=/app/uploads $IMAGE_URI",
              "docker ps --filter name=app"
            ]
          }
          SSMPARAMS
          COMMAND_ID=$(aws ssm send-command --instance-ids "$INSTANCE_ID" --region "$REGION" --document-name "AWS-RunShellScript" --parameters file:///tmp/ssm-params.json --query "Command.CommandId" --output text)
          echo "SSM command: $COMMAND_ID"
          for i in $(seq 1 30); do
            STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --region "$REGION" --query "Status" --output text)
            echo "Status: $STATUS"
            if [ "$STATUS" = "Success" ]; then exit 0; fi
            if [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
              aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --region "$REGION" --query "{Output: StandardOutputContent, Error: StandardErrorContent}" --output text || true
              exit 1
            fi
            sleep 10
          done
          exit 1

      - name: Verify health
        run: |
          set -x
          PUBLIC_URL="http://15.207.145.62"
          for i in $(seq 1 30); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$PUBLIC_URL/health" || true)
            echo "HTTP $CODE"
            if [ "$CODE" = "200" ]; then echo "Deployment healthy"; exit 0; fi
            sleep 10
          done
          echo "Health check failed"
          exit 1