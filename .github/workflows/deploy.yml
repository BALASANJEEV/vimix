name: Deploy Vimix CRM to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGION: ap-south-1
  ECR_REGISTRY: 759204735992.dkr.ecr.ap-south-1.amazonaws.com
  ECR_REPOSITORY: vimix
  INSTANCE_ID: i-03655caf15c2e7e1d
  IMAGE_TAG: ${{ github.sha }}
  PUBLIC_URL: ${{ secrets.PUBLIC_URL }}

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:latest
          build-args: |
            VITE_API_URL=
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.REGION }}

      - name: Deploy and wait for EC2 command
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          FRONTEND_ORIGIN: ${{ secrets.FRONTEND_ORIGIN }}
        run: |
          set -euo pipefail

          : "${MONGODB_URI:?GitHub secret MONGODB_URI is required}"
          : "${JWT_SECRET:?GitHub secret JWT_SECRET is required}"
          : "${REDIS_URL:?GitHub secret REDIS_URL is required}"
          : "${FRONTEND_ORIGIN:?GitHub secret FRONTEND_ORIGIN is required}"
          : "${PUBLIC_URL:?GitHub secret PUBLIC_URL is required}"

          APP_ENV_B64=$(printf 'NODE_ENV=production\nPORT=5000\nMONGODB_URI=%s\nJWT_SECRET=%s\nREDIS_URL=%s\nFRONTEND_ORIGIN=%s\nUPLOAD_DIR=/app/backend/uploads\nALLOW_PUBLIC_SIGNUP=false\n' \
            "$MONGODB_URI" "$JWT_SECRET" "$REDIS_URL" "$FRONTEND_ORIGIN" | base64 -w0)
          IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"

          REMOTE_SCRIPT=$(cat <<EOF
          set -eu
          mkdir -p /etc/vimix
          printf '%s' '${APP_ENV_B64}' | base64 -d > /etc/vimix/app.env
          aws ecr get-login-password --region '${REGION}' | docker login --username AWS --password-stdin '${ECR_REGISTRY}'
          docker pull '${IMAGE_URI}'
          docker stop app 2>/dev/null || true
          docker rm app 2>/dev/null || true
          docker run -d --restart always --name app -p 80:80 --env-file /etc/vimix/app.env -v vimix-uploads:/app/backend/uploads '${IMAGE_URI}'
          EOF
          )

          jq -n --arg script "$REMOTE_SCRIPT" '{commands: [$script]}' > /tmp/ssm-params.json
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --region "$REGION" \
            --document-name AWS-RunShellScript \
            --parameters file:///tmp/ssm-params.json \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM command: $COMMAND_ID"
          for attempt in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --region "$REGION" \
              --query 'Status' \
              --output text 2>/dev/null || true)
            case "$STATUS" in
              Success)
                echo 'EC2 deployment completed.'
                exit 0
                ;;
              Failed|Cancelled|TimedOut|Undeliverable|Terminated)
                aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --region "$REGION" --query '{status:Status,stdout:StandardOutputContent,stderr:StandardErrorContent}' --output json || true
                exit 1
                ;;
            esac
            sleep 5
          done

          echo 'Timed out waiting for the EC2 SSM command.'
          exit 1

  verify:
    name: Verify Deployment
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Verify application readiness
        run: |
          set -euo pipefail
          : "${PUBLIC_URL:?GitHub secret PUBLIC_URL is required}"
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error "$PUBLIC_URL/health/ready"; then
              echo
              exit 0
            fi
            sleep 5
          done
          echo 'Application did not become ready.'
          exit 1

      - name: Verify frontend serves
        run: |
          set -euo pipefail
          curl --fail --silent --show-error "$PUBLIC_URL/" > /dev/null
          echo 'Frontend check passed.'
