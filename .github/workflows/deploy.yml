name: Build & Deploy Vimix CRM to EC2 Docker

on:
  push:
    branches: ["main"]
  workflow_dispatch:

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: vimix
  ECR_REGISTRY: 759204735992.dkr.ecr.ap-south-1.amazonaws.com
  INSTANCE_ID: i-002ecb281bdf403cd
  SECRET_ID: deptic/vimix/secrets
  PUBLIC_URL: http://13.232.139.188

jobs:
  build-deploy:
    name: Build, Push and Deploy
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ap-south-1
      AWS_REGION: ap-south-1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Dockerfile exists
        run: |
          set -e
          test -f Dockerfile || { echo "Dockerfile not found at repository root"; exit 1; }
          echo "==> Dockerfile found at repository root"

      - name: Login to Amazon ECR
        run: |
          set -e
          aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"

      - name: Build, tag, and push Docker image to ECR
        run: |
          set -e
          FULL_IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY"
          echo "==> Building $FULL_IMAGE:latest from context: ."
          docker build \
            --tag "$FULL_IMAGE:$GITHUB_SHA" \
            --tag "$FULL_IMAGE:latest" \
            --file Dockerfile .
          echo "==> Pushing $FULL_IMAGE:$GITHUB_SHA"
          docker push "$FULL_IMAGE:$GITHUB_SHA"
          echo "==> Pushing $FULL_IMAGE:latest"
          docker push "$FULL_IMAGE:latest"

      - name: Deploy to EC2 via SSM
        run: |
          set -e
          REGION="ap-south-1"
          INSTANCE_ID="i-002ecb281bdf403cd"
          SECRET_ID="deptic/vimix/secrets"
          ECR_REGISTRY="759204735992.dkr.ecr.ap-south-1.amazonaws.com"
          IMAGE_URI="$ECR_REGISTRY/vimix:latest"

          cat > /tmp/ssm-params.json << 'SSMPARAMS'
          {
            "commands": [
              "set -e",
              "aws ecr get-login-password --region $REGION | docker login --username AWS --password-stdin $ECR_REGISTRY",
              "docker pull $IMAGE_URI",
              "aws secretsmanager get-secret-value --secret-id $SECRET_ID --region $REGION --query SecretString --output text > /tmp/vimix-secrets.json",
              "python3 -c 'import json;s=json.load(open(\"/tmp/vimix-secrets.json\"));keys=(\"NODE_ENV\",\"PORT\",\"MONGODB_URI\",\"JWT_SECRET\",\"FRONTEND_ORIGIN\",\"REDIS_URL\",\"UPLOAD_DIR\",\"ALLOW_PUBLIC_SIGNUP\");open(\"/tmp/vimix.env\",\"w\").write(\"\".join(f\"{k}={s[k]}\\n\" for k in keys if k in s))'",
              "docker stop app || true",
              "docker rm app || true",
              "docker run -d --restart always -p 80:80 --name app --env-file /tmp/vimix.env $IMAGE_URI",
              "rm -f /tmp/vimix-secrets.json",
              "sleep 10",
              "docker ps --filter name=app --format '{{.ID}} {{.Status}}'",
              "docker logs app --tail 50 || true"
            ]
          }
          SSMPARAMS

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --region "$REGION" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy Vimix CRM $GITHUB_SHA" \
            --parameters file:///tmp/ssm-params.json \
            --query "Command.CommandId" --output text)

          echo "==> Waiting for SSM command $COMMAND_ID"
          aws ssm wait command-executed \
            --instance-id "$INSTANCE_ID" \
            --command-id "$COMMAND_ID" \
            --region "$REGION"

          STATUS=$(aws ssm list-command-invocations \
            --instance-id "$INSTANCE_ID" \
            --command-id "$COMMAND_ID" \
            --region "$REGION" \
            --query "CommandInvocations[0].Status" --output text)

          echo "==> SSM command status: $STATUS"
          if [ "$STATUS" != "Success" ]; then
            aws ssm list-command-invocations \
              --instance-id "$INSTANCE_ID" \
              --command-id "$COMMAND_ID" \
              --region "$REGION" \
              --details \
              --query "CommandInvocations[0].CommandPlugins" --output text || true
            exit 1
          fi

      - name: Health check
        run: |
          set -e
          URL="http://13.232.139.188/health"
          echo "==> Checking $URL"
          for i in $(seq 1 15); do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$URL" || true)
            echo "Attempt $i: HTTP $HTTP_CODE"
            if [ "$HTTP_CODE" = "200" ]; then
              echo "==> Health check passed"
              exit 0
            fi
            sleep 10
          done
          echo "==> Health check failed after retries"
          exit 1