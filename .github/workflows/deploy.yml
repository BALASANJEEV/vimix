name: Deploy Vimix CRM to EC2 Docker

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: ap-south-1
  ECR_REGISTRY: 759204735992.dkr.ecr.ap-south-1.amazonaws.com
  ECR_REPOSITORY: vimix
  INSTANCE_ID: i-037c138adf0855d67
  PUBLIC_URL: http://13.234.210.33
  SECRETS_MANAGER_ID: deptic/vimix/secrets

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image_uri: ${{ steps.image.outputs.image_uri }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        run: |
          export AWS_ACCESS_KEY_ID="${{ secrets.AWS_ACCESS_KEY_ID }}"
          export AWS_SECRET_ACCESS_KEY="${{ secrets.AWS_SECRET_ACCESS_KEY }}"
          export AWS_DEFAULT_REGION="${AWS_REGION}"
          aws sts get-caller-identity

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute image URI
        id: image
        run: echo "image_uri=$ECR_REGISTRY/$ECR_REPOSITORY:${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

      - name: Login to ECR
        run: |
          export AWS_ACCESS_KEY_ID="${{ secrets.AWS_ACCESS_KEY_ID }}"
          export AWS_SECRET_ACCESS_KEY="${{ secrets.AWS_SECRET_ACCESS_KEY }}"
          export AWS_DEFAULT_REGION="${AWS_REGION}"
          aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"

      - name: Build image
        run: |
          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:${GITHUB_SHA::8}"
          docker build -t "$IMAGE_URI" -f Dockerfile . 2>&1 | tee /tmp/build.log || { echo "::error::Docker build failed"; tail -100 /tmp/build.log; exit 1; }
          docker images | head -5

      - name: Push image
        run: |
          export AWS_ACCESS_KEY_ID="${{ secrets.AWS_ACCESS_KEY_ID }}"
          export AWS_SECRET_ACCESS_KEY="${{ secrets.AWS_SECRET_ACCESS_KEY }}"
          export AWS_DEFAULT_REGION="${AWS_REGION}"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:${GITHUB_SHA::8}"

  deploy-and-verify:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Configure AWS credentials
        run: |
          export AWS_ACCESS_KEY_ID="${{ secrets.AWS_ACCESS_KEY_ID }}"
          export AWS_SECRET_ACCESS_KEY="${{ secrets.AWS_SECRET_ACCESS_KEY }}"
          export AWS_DEFAULT_REGION="${AWS_REGION}"
          aws sts get-caller-identity

      - name: Fetch runtime secrets
        run: |
          export AWS_ACCESS_KEY_ID="${{ secrets.AWS_ACCESS_KEY_ID }}"
          export AWS_SECRET_ACCESS_KEY="${{ secrets.AWS_SECRET_ACCESS_KEY }}"
          export AWS_DEFAULT_REGION="${AWS_REGION}"
          SECRET_JSON=$(aws secretsmanager get-secret-value --secret-id "$SECRETS_MANAGER_ID" --query SecretString --output text)
          echo "MONGODB_URI=$(echo "$SECRET_JSON" | jq -r '.MONGODB_URI // empty')" >> /tmp/secret.env
          echo "JWT_SECRET=$(echo "$SECRET_JSON" | jq -r '.JWT_SECRET // empty')" >> /tmp/secret.env
          echo "REDIS_URL=$(echo "$SECRET_JSON" | jq -r '.REDIS_URL // empty')" >> /tmp/secret.env
          if [ ! -s /tmp/secret.env ]; then echo "::error::No runtime secrets resolved"; exit 1; fi

      - name: Deploy via SSM
        run: |
          export AWS_ACCESS_KEY_ID="${{ secrets.AWS_ACCESS_KEY_ID }}"
          export AWS_SECRET_ACCESS_KEY="${{ secrets.AWS_SECRET_ACCESS_KEY }}"
          export AWS_DEFAULT_REGION="${AWS_REGION}"
          IMAGE_URI="${{ needs.build-and-push.outputs.image_uri }}"
          ENV_ARGS=""
          while IFS='=' read -r k v; do
            [ -n "$k" ] && ENV_ARGS="$ENV_ARGS -e $k='$v'"
          done < /tmp/secret.env
          cat > /tmp/ssm-params.json << SSMPARAMS
          {
            "commands": [
              "aws ecr get-login-password --region ${AWS_REGION} | docker login --username AWS --password-stdin ${ECR_REGISTRY}",
              "docker pull ${IMAGE_URI}",
              "docker stop app || true",
              "docker rm app || true",
              "docker run -d --restart always -p 80:80 --name app ${ENV_ARGS} ${IMAGE_URI}",
              "docker ps --filter name=app"
            ]
          }
          SSMPARAMS
          COMMAND_ID=$(aws ssm send-command --instance-ids "$INSTANCE_ID" --region "$AWS_REGION" --document-name "AWS-RunShellScript" --parameters file:///tmp/ssm-params.json --query "Command.CommandId" --output text)
          echo "SSM Command ID: $COMMAND_ID"
          for i in $(seq 1 30); do
            STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --region "$AWS_REGION" --query Status --output text)
            echo "Attempt $i: $STATUS"
            [ "$STATUS" = "Success" ] && break
            [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ] && { aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --region "$AWS_REGION" --query StandardErrorContent --output text; exit 1; }
            sleep 10
          done
          [ "$STATUS" = "Success" ] || { echo "::error::SSM command did not succeed"; exit 1; }

      - name: Verify deployment health
        run: |
          for i in $(seq 1 20); do
            CODE=$(curl -s -o /tmp/health.json -w "%{http_code}" "$PUBLIC_URL/health" || echo "000")
            echo "Attempt $i: HTTP $CODE"
            if [ "$CODE" = "200" ]; then cat /tmp/health.json; echo "Health check passed"; exit 0; fi
            sleep 15
          done
          echo "::error::Health check failed: did not receive HTTP 200 from $PUBLIC_URL/health"
          exit 1