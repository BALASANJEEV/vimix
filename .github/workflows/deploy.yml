name: deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USER: ${{ secrets.EC2_USER }}
      SSH_KEY: ${{ secrets.SSH_KEY }}
      DOCKER_IMAGE: vimix-app
      CONTAINER_NAME: app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install SSH key
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H $EC2_HOST >> ~/.ssh/known_hosts

      - name: Build Docker image
        run: |
          docker build -t $DOCKER_IMAGE .

      - name: Save Docker image to tarball
        run: |
          docker save $DOCKER_IMAGE | gzip > image.tar.gz

      - name: Copy image to EC2
        run: |
          scp -i ~/.ssh/id_rsa image.tar.gz $EC2_USER@$EC2_HOST:/home/$EC2_USER/image.tar.gz

      - name: Deploy on EC2
        run: |
          ssh -i ~/.ssh/id_rsa $EC2_USER@$EC2_HOST << 'EOF'
            # Stop and remove old container if exists
            docker stop $CONTAINER_NAME 2>/dev/null || true
            docker rm $CONTAINER_NAME 2>/dev/null || true

            # Load new image
            docker load < /home/$EC2_USER/image.tar.gz

            # Run the container
            docker run -d \
              --name $CONTAINER_NAME \
              -p 80:80 \
              -p 5000:5000 \
              -e MONGO_URI='$MONGO_URI' \
              -e JWT_SECRET='$JWT_SECRET' \
              -e PORT=5000 \
              $DOCKER_IMAGE

            # Clean up tarball
            rm /home/$EC2_USER/image.tar.gz
          EOF
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          CONTAINER_NAME: app
