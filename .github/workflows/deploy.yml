# Vimix CRM — Production Deployment Workflow
# Builds multi‑stage Docker image → pushes to ECR → deploys via SSM on EC2/Docker
# Health check confirms the container is serving HTTP 200 on the public IP.

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGION: ap-south-1
  ECR_REGISTRY: 759204735992.dkr.ecr.ap-south-1.amazonaws.com
  ECR_REPOSITORY: vimix
  INSTANCE_ID: i-0cbf9975c6444f12e
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials (static)
        run: |
          mkdir -p ~/.aws
          cat > ~/.aws/credentials << 'EOF'
          [default]
          aws_access_key_id = ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_access_key = ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          EOF
          cat > ~/.aws/config << 'CONF'
          [default]
          region = ${{ env.REGION }}
          output = json
          CONF

      - name: Authenticate Docker to ECR
        run: |
          aws ecr get-login-password --region $REGION | \
            docker login --username AWS --password-stdin $ECR_REGISTRY

      - name: Build and push Docker image
        run: |
          FULL_IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker build \
            --build-arg VITE_API_URL=https://api.example.com \
            -t $FULL_IMAGE_URI \
            -f Dockerfile .
          docker push $FULL_IMAGE_URI
          
          # Also push as ‘latest’ for convenience
          docker tag $FULL_IMAGE_URI $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Deploy via SSM Run Command on EC2
        run: |
          FULL_IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          cat > /tmp/ssm-params.json << 'SSMPARAMS'
          {
            "commands": [
              "aws ecr get-login-password --region $REGION | docker login --username AWS --password-stdin $ECR_REGISTRY",
              "docker pull $FULL_IMAGE_URI",
              "docker stop vimix-app || true",
              "docker rm vimix-app || true",
              "docker run -d --restart always -p 80:80 --name vimix-app $FULL_IMAGE_URI"
            ]
          }
          SSMPARAMS
          # Inject env variables into the JSON file
          sed -i "s|\$REGION|$REGION|g; s|\$ECR_REGISTRY|$ECR_REGISTRY|g; s|\$FULL_IMAGE_URI|$FULL_IMAGE_URI|g" /tmp/ssm-params.json

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --region "$REGION" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/ssm-params.json \
            --query "Command.CommandId" \
            --output text)

          echo "SSM command sent: $COMMAND_ID"

          # Wait for command to finish (up to 120 seconds)
          for i in $(seq 1 24); do
            STATUS=$(aws ssm list-command-invocations \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --region "$REGION" \
              --query "CommandInvocations[0].Status" \
              --output text)
            if [ "$STATUS" = "Success" ]; then
              echo "SSM command completed successfully"
              break
            elif [ "$STATUS" = "Failed" ] || [ "$STATUS" = "TimedOut" ]; then
              echo "SSM command failed with status: $STATUS"
              # Show stderr output
              aws ssm list-command-invocations \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --region "$REGION" \
                --query "CommandInvocations[0].CommandPlugins[0].Output" \
                --output text
              exit 1
            fi
            sleep 5
          done

      - name: Health check – wait for container to serve HTTP 200
        run: |
          PUBLIC_URL="http://35.154.76.18"
          echo "Checking health at $PUBLIC_URL"
          for i in $(seq 1 20); do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$PUBLIC_URL" || echo "000")
            if [ "$HTTP_CODE" = "200" ]; then
              echo "Health check passed (HTTP 200)"
              exit 0
            fi
            echo "Attempt $i: got HTTP $HTTP_CODE, retrying..."
            sleep 6
          done
          echo "Health check FAILED after 20 attempts"
          curl -v --max-time 10 "$PUBLIC_URL" || true
          exit 1