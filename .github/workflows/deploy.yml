name: Deploy Vimix CRM to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: ap-south-1
  ECR_REGISTRY: 759204735992.dkr.ecr.ap-south-1.amazonaws.com
  ECR_REPOSITORY: vimix
  INSTANCE_ID: i-0cbf9975c6444f12e
  PUBLIC_URL: http://35.154.76.18

jobs:
  build-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image with tags
        id: build
        run: |
          IMAGE_TAG="${{ github.sha }}-$(date +%Y%m%d%H%M%S)"
          FULL_IMAGE="${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:$IMAGE_TAG"
          echo "FULL_IMAGE=${FULL_IMAGE}" >> "$GITHUB_OUTPUT"
          echo "IMAGE_TAG=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

          # Build the Docker image
          docker build \
            --build-arg VITE_API_URL=${{ env.PUBLIC_URL }} \
            -t "$FULL_IMAGE" \
            -f ${{ env.DOCKERFILE_PATH }} .

      - name: Push to Amazon ECR
        run: |
          # Get login password and authenticate Docker
          aws ecr get-login-password --region "${{ env.AWS_REGION }}" | docker login --username AWS --password-stdin "${{ env.ECR_REGISTRY }}"
          docker push "${{ steps.build.outputs.FULL_IMAGE }}"

      - name: Deploy via SSM
        run: |
          REGION="${{ env.AWS_REGION }}"
          ECR_REGISTRY="${{ env.ECR_REGISTRY }}"
          ECR_REPOSITORY="${{ env.ECR_REPOSITORY }}"
          IMAGE_URI="${{ steps.build.outputs.FULL_IMAGE }}"
          INSTANCE_ID="${{ env.INSTANCE_ID }}"

          # Write SSM parameters to a file
          cat > /tmp/ssm-params.json << 'SSMPARAMS'
          {
            "commands": [
              "aws ecr get-login-password --region $REGION | docker login --username AWS --password-stdin $ECR_REGISTRY",
              "docker pull $IMAGE_URI",
              "docker stop app || true",
              "docker rm app || true",
              "docker run -d --restart always -p 80:80 --name app $IMAGE_URI"
            ]
          }
          SSMPARAMS

          # Send command to SSM
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --region "$REGION" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/ssm-params.json \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          # Wait up to 5 minutes for the command to complete
          for i in $(seq 1 30); do
            STATUS=$(aws ssm list-command-invocations \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --region "$REGION" \
              --query "CommandInvocations[0].Status" \
              --output text)
            echo "Attempt $i: Status=$STATUS"
            if [ "$STATUS" == "Success" ]; then
              echo "Deployment command completed successfully"
              exit 0
            elif [ "$STATUS" == "Failed" ] || [ "$STATUS" == "TimedOut" ] || [ "$STATUS" == "Cancelled" ]; then
              echo "Deployment command failed with status: $STATUS"
              # Fetch command output for debugging
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --region "$REGION" \
                --output text
              exit 1
            fi
            sleep 10
          done

          echo "Timed out waiting for deployment command"
          exit 1
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ env.AWS_REGION }}

      - name: Health Check
        run: |
          echo "Waiting for container to start..."
          sleep 15
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "${{ env.PUBLIC_URL }}/health" || echo "000")
          if [ "$HTTP_CODE" != "200" ]; then
            echo "Health check failed with HTTP $HTTP_CODE on ${{ env.PUBLIC_URL }}/health"
            # Try the root endpoint
            HTTP_CODE_ROOT=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "${{ env.PUBLIC_URL }}" || echo "000")
            echo "Root endpoint returned HTTP $HTTP_CODE_ROOT"
            if [ "$HTTP_CODE_ROOT" != "200" ]; then
              echo "Both health and root endpoints are failing"
              exit 1
            fi
          fi
          echo "Health check passed with HTTP $HTTP_CODE"