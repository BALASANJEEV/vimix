name: Production Deployment

on:
  push:
    branches:
      - main
    tags:
      - '*'

env:
  REGION: ap-south-1
  ECR_REGISTRY: 759204735992.dkr.ecr.ap-south-1.amazonaws.com
  ECR_REPO_NAME: vimix
  ECR_REPO_URI: 759204735992.dkr.ecr.ap-south-1.amazonaws.com/vimix
  INSTANCE_ID: i-0a3953db00393148e
  PUBLIC_URL: http://13.207.128.93
  IMAGE_TAG: latest

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      AWS_DEFAULT_REGION: ${{ env.REGION }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.REGION }}
          # The action will use AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY
          # from repository secrets if they are present.

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registry-type: both
          registry: ${{ env.ECR_REGISTRY }}

      - name: Build and push Docker image
        run: |
          docker buildx build \
            --platform linux/amd64 \
            -t ${{ env.ECR_REPO_URI }}:${{ env.IMAGE_TAG }} \
            -f Dockerfile . --push

      - name: Prepare SSM deployment commands
        run: |
          cat > /tmp/ssm-params.json <<'EOF'
          {
            "commands": [
              "aws ecr get-login-password --region ${{ env.REGION }} | docker login --username AWS --password-stdin ${{ env.ECR_REGISTRY }}",
              "docker pull ${{ env.ECR_REPO_URI }}:${{ env.IMAGE_TAG }}",
              "docker stop app || true",
              "docker rm app || true",
              "docker run -d --restart always -p 80:80 --name app ${{ env.ECR_REPO_URI }}:${{ env.IMAGE_TAG }}"
            ]
          }
          EOF

      - name: Deploy to EC2 via SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ env.INSTANCE_ID }}" \
            --region "${{ env.REGION }}" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/ssm-params.json \
            --query "Command.CommandId" --output text)
          echo "SSM Command ID: $COMMAND_ID"

          # Poll for command status
          for i in {1..30}; do
            STATUS=$(aws ssm list-command-invocations \
              --command-id "$COMMAND_ID" \
              --instance-ids "${{ env.INSTANCE_ID }}" \
              --query "CommandInvocations[0].Status" --output text)
            echo "Command status: $STATUS"
            if [[ "$STATUS" == "Success" ]]; then
              break
            elif [[ "$STATUS" == "Failed" ]]; then
              echo "SSM deployment failed!"
              exit 1
            fi
            sleep 5
          done
          echo "Deployment completed successfully."

      - name: Health Check
        run: |
          set -e
          echo "Performing health check on ${{ env.PUBLIC_URL }}..."
          curl -f -s "${{ env.PUBLIC_URL }}/health" > /dev/null
          echo "Health check succeeded."