# Rapid24: added SSH host deploy (publish-only is incomplete).
# Generated by Rapid24 Sandbox — review before merging to production.
name: Deploy

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run build --if-present

  rapid24_deploy_host:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Pull image and restart on Linux host (SSH)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail
            DEPLOY_PATH="${{ secrets.DEPLOY_PATH }}"
            if [ -z "$DEPLOY_PATH" ]; then DEPLOY_PATH="/opt/app"; fi
            cd "$DEPLOY_PATH"
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin || true
            docker pull ghcr.io/${{ github.repository }}:latest || docker compose pull
            if [ -f docker-compose.yml ] || [ -f compose.yml ]; then
              docker compose pull || true
              docker compose up -d
            else
              docker image prune -f || true
            fi
