# Deploying a Docker image to AWS ECS Fargate
#
# This workflow:
#   1. Checks out the repo
#   2. Sets up Node 20 (required for the build step)
#   3. Configures AWS credentials
#   4. Retrieves the AWS account ID (needed for ECR image URI)
#   5. Logs into Amazon ECR
#   6. Builds and pushes the Docker image
#   7. Updates the ECS task definition, replacing the ${IMAGE_URI} placeholder
#      with the newly pushed image URI.
#   8. Triggers the ECS service update and waits for stability.
#
# The workflow uses only officially supported GitHub Actions.

name: Deploy to AWS ECS Fargate

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ vars.AWS_REGION }}

      - name: Retrieve AWS account ID
        id: account
        run: |
          echo "ACCOUNT_ID=$(aws sts get-caller-identity --output text --query Account)" >> $GITHUB_ENV
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        env:
          IMAGE_TAG: ${{ github.sha }}
          ACCOUNT_ID: ${{ env.ACCOUNT_ID }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          IMAGE_URI=$ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/vimix:$IMAGE_TAG
          docker build -t $IMAGE_URI .
          docker push $IMAGE_URI

      - name: Deploy to Amazon ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ecs-task-def.json
          cluster: ${{ vars.ECS_CLUSTER }}
          service: ${{ vars.ECS_SERVICE }}
          wait-for-service-stability: true
          enable-rollback-on-deploy-failure: true
        env:
          IMAGE_URI: ${{ env.ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com/vimix:${{ github.sha }}