name: Deploy to ECS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      REPO_URI: "$${{ secrets.ECR_REGISTRY }}/${{ vars.ECR_REPOSITORY }}"
      IMAGE_TAG: "$${{ github.sha }}"
      CLUSTER: "${{ vars.ECS_CLUSTER }}"
      SERVICE: "${{ vars.ECS_SERVICE }}"
      TASK_DEFINITION: "task-definition.json"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: $${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: $${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: $${{ vars.AWS_REGION }}

      - name: Log in to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        run: |
          docker build -t $REPO_URI:$IMAGE_TAG .
          docker push $REPO_URI:$IMAGE_TAG

      - name: Register new task definition
        id: register_task
        run: |
          UPDATED_TASK=$(cat $TASK_DEFINITION | jq --arg image "$REPO_URI:$IMAGE_TAG" '.containerDefinitions[0].image=$image')
          echo "$UPDATED_TASK" > /tmp/updated-task.json
          aws ecs register-task-definition \
            --cli-input-json file:///tmp/updated-task.json

      - name: Update ECS service
        run: |
          aws ecs update-service \
            --cluster $CLUSTER \
            --service $SERVICE \
            --force-new-deployment