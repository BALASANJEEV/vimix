name: Build & Deploy to EC2 Docker

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      REGION: ap-south-1
      ECR_REPOSITORY_URI: 759204735992.dkr.ecr.ap-south-1.amazonaws.com/vimix
      INSTANCE_ID: i-09cb51a6f25842967
      PUBLIC_URL: http://15.207.49.159
      CONTAINER_PORT: 80
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        id: build-image
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -e
          IMAGE_URI="${ECR_REPOSITORY_URI}"
          echo "Building Docker image ${IMAGE_URI}:${IMAGE_TAG}"
          docker build \
            --progress=plain \
            --file Dockerfile \
            --tag "${IMAGE_URI}:${IMAGE_TAG}" \
            --tag "${IMAGE_URI}:latest" \
            .
          echo "image_uri=${IMAGE_URI}" >> "$GITHUB_OUTPUT"

      - name: Build diagnostics
        run: |
          set -e
          echo "Docker images:"
          docker images --format "table {{.Repository}}\t{{.Tag}}\t{{.Size}}"
          echo "Docker build history for latest image:"
          docker history "${ECR_REPOSITORY_URI}:latest" | head -n 20

      - name: Push Docker images
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -e
          IMAGE_URI="${ECR_REPOSITORY_URI}"
          echo "Pushing Docker image ${IMAGE_URI}:${IMAGE_TAG}"
          docker push "${IMAGE_URI}:${IMAGE_TAG}"
          echo "Pushing Docker image ${IMAGE_URI}:latest"
          docker push "${IMAGE_URI}:latest"

      - name: Deploy image to EC2 via SSM
        run: |
          set -e
          cat > /tmp/ssm-params.json << 'SSMPARAMS'
          {
            "commands": [
              "aws ecr get-login-password --region ap-south-1 | docker login --username AWS --password-stdin 759204735992.dkr.ecr.ap-south-1.amazonaws.com",
              "docker pull 759204735992.dkr.ecr.ap-south-1.amazonaws.com/vimix:latest",
              "docker stop app || true",
              "docker rm app || true",
              "docker run -d --restart always -p 80:80 --name app 759204735992.dkr.ecr.ap-south-1.amazonaws.com/vimix:latest"
            ]
          }
          SSMPARAMS

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --region "$REGION" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/ssm-params.json \
            --query "Command.CommandId" \
            --output text)

          echo "SSM command sent (ID: $COMMAND_ID). Waiting for completion..."
          while true; do
            STATUS=$(aws ssm list-command-invocations \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --region "$REGION" \
              --details \
              --query "CommandInvocations[0].Status" \
              --output text)
            echo "Current SSM status: $STATUS"
            if [[ "$STATUS" == "Success" ]]; then
              echo "Deployment succeeded."
              break
            elif [[ "$STATUS" == "Failed" || "$STATUS" == "Cancelled" || "$STATUS" == "TimedOut" ]]; then
              echo "Deployment failed with status $STATUS."
              exit 1
            else
              sleep 5
            fi
          done

      - name: Verify service health
        env:
          HEALTH_URL: "${{ env.PUBLIC_URL }}/health"
        run: |
          set -e
          echo "Waiting for health endpoint $HEALTH_URL..."
          for i in $(seq 1 30); do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$HEALTH_URL" || echo "000")
            if [ "$HTTP_CODE" = "200" ]; then
              echo "Health check passed."
              exit 0
            fi
            echo "Attempt $i: received HTTP $HTTP_CODE, retrying in 5s..."
            sleep 5
          done
          echo "Health check failed after multiple attempts."
          exit 1