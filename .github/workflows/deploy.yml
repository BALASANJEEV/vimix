name: Build and Deploy Vimix CRM

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGION: ap-south-1
  ECR_REGISTRY: 759204735992.dkr.ecr.ap-south-1.amazonaws.com
  ECR_REPOSITORY: vimix
  INSTANCE_ID: i-0cbf9975c6444f12e
  AWS_DEFAULT_REGION: ap-south-1

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configure AWS credentials
        run: |
          mkdir -p ~/.aws
          cat > ~/.aws/credentials <<EOF
          [default]
          aws_access_key_id = ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_access_key = ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          EOF

      - name: Login to Amazon ECR
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          aws ecr get-login-password --region $REGION | docker login --username AWS --password-stdin $ECR_REGISTRY

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          IMAGE_TAG="${{ github.sha }}"
          FULL_IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY"
          docker build \
            --build-arg VITE_API_URL=http://35.154.76.18/api \
            -t $FULL_IMAGE:$IMAGE_TAG \
            -t $FULL_IMAGE:latest \
            -f Dockerfile .
          docker push $FULL_IMAGE:$IMAGE_TAG
          docker push $FULL_IMAGE:latest
          echo "IMAGE_URI=$FULL_IMAGE:$IMAGE_TAG" >> $GITHUB_ENV

      - name: Deploy via SSM on EC2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}"

          cat > /tmp/ssm-params.json << 'SSMPARAMS'
          {
            "commands": [
              "aws ecr get-login-password --region ap-south-1 | docker login --username AWS --password-stdin 759204735992.dkr.ecr.ap-south-1.amazonaws.com",
              "docker pull 759204735992.dkr.ecr.ap-south-1.amazonaws.com/vimix:${{ github.sha }}",
              "docker stop app || true",
              "docker rm app || true",
              "docker run -d --restart always -p 80:80 --name app 759204735992.dkr.ecr.ap-south-1.amazonaws.com/vimix:${{ github.sha }}"
            ]
          }
          SSMPARAMS

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --region "$REGION" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/ssm-params.json \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"
          
          # Wait for command to complete
          sleep 30
          aws ssm list-command-invocations \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --details \
            --query "CommandInvocations[0].CommandPlugins[0].Output" \
            --output text

      - name: Health check
        run: |
          echo "Waiting for application to start..."
          sleep 15
          for i in {1..12}; do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://35.154.76.18/ || echo "000")
            if [ "$HTTP_CODE" = "200" ]; then
              echo "Health check passed - HTTP 200"
              exit 0
            fi
            echo "Attempt $i: HTTP $HTTP_CODE - retrying in 10s..."
            sleep 10
          done
          echo "Health check failed after all retries"
          exit 1