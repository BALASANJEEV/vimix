name: Deploy to ECS

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2
        id: ecr

      - name: Build and push Docker image
        env:
          IMAGE_TAG: ${{ github.sha }}
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          ECR_REPOSITORY: vimix
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Update ECS Task Definition and Deploy Service
        env:
          CLUSTER_NAME: vimix-cluster
          SERVICE_NAME: vimix-service
          TASK_DEFINITION: vimix-task
          IMAGE_URI: ${{ steps.ecr.outputs.registry }}/vimix:${{ github.sha }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
        run: |
          # Fetch the latest task definition ARN
          TASK_FAMILY=$(aws ecs list-task-definitions --family-prefix $TASK_DEFINITION --sort DESC --max-items 1 | jq -r '.taskDefinitionArns[0]')
          TASK_DEF_JSON=$(aws ecs describe-task-definition --task-definition $TASK_FAMILY | jq '.taskDefinition')

          # Replace the image in the container definition
          UPDATED_TASK=$(echo "$TASK_DEF_JSON" | jq --arg IMAGE_URI "$IMAGE_URI" '.containerDefinitions[0].image = $IMAGE_URI')

          # Register a new task definition revision
          NEW_TASK_DEF=$(echo "$UPDATED_TASK" | jq '.requiresCompatibilities, cpu, memory, networkMode, executionRoleArn, taskRoleArn, containerDefinitions')
          NEW_TASK_DEF_WITH_FAMILY=$(echo "$NEW_TASK_DEF" | jq --arg family "$TASK_DEFINITION" '.family=$family')
          REGISTER_OUTPUT=$(aws ecs register-task-definition --cli-input-json "$NEW_TASK_DEF_WITH_FAMILY")
          NEW_TASK_ARN=$(echo "$REGISTER_OUTPUT" | jq -r '.taskDefinition.taskDefinitionArn')

          # Update the service to use the new task definition
          aws ecs update-service --cluster $CLUSTER_NAME --service $SERVICE_NAME --task-definition $NEW_TASK_ARN --desired-count 1
          echo "Deployment updated. New task definition ARN: $NEW_TASK_ARN"
