name: Deploy to EC2 Docker

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ap-south-1
      ECR_REGISTRY: 759204735992.dkr.ecr.ap-south-1.amazonaws.com
      ECR_REPOSITORY_URI: 759204735992.dkr.ecr.ap-south-1.amazonaws.com/vimix
      INSTANCE_ID: i-0306a160c85e1a53a
      IMAGE_TAG: ${{ github.sha }}
      IMAGE_URI: ${{ env.ECR_REPOSITORY_URI }}:${{ github.sha }}
      PUBLIC_URL: http://3.7.137.19

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        run: |
          docker build --platform linux/amd64 -t "$IMAGE_URI" .
          docker push "$IMAGE_URI"

      - name: Create SSM parameters file
        run: |
          cat > /tmp/ssm-params.json <<'SSMPARAMS'
          {
            "commands": [
              "yum update -y",
              "aws ecr get-login-password --region $REGION | docker login --username AWS --password-stdin $ECR_REGISTRY",
              "docker pull $IMAGE_URI",
              "docker stop app || true",
              "docker rm app || true",
              "docker run -d --restart always -p 80:80 --name app $IMAGE_URI"
            ]
          }
          SSMPARAMS
        env:
          REGION: ${{ env.AWS_REGION }}
          ECR_REGISTRY: ${{ env.ECR_REGISTRY }}
          IMAGE_URI: ${{ env.IMAGE_URI }}

      - name: Deploy via SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --region "$REGION" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/ssm-params.json \
            --query "Command.CommandId" \
            --output text)
          echo "SSM Command ID: $COMMAND_ID"
        env:
          INSTANCE_ID: ${{ env.INSTANCE_ID }}
          REGION: ${{ env.AWS_REGION }}

      - name: Wait for deployment to settle
        run: sleep 60s

      - name: Verify application health
        run: |
          echo "Checking health at $PUBLIC_URL/health"
          curl -f -s $PUBLIC_URL/health
        env:
          PUBLIC_URL: ${{ env.PUBLIC_URL }}