name: Deploy Vimix CRM to EC2 Docker

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: ap-south-1
  ECR_REGISTRY: 759204735992.dkr.ecr.ap-south-1.amazonaws.com
  ECR_REPOSITORY: vimix
  INSTANCE_ID: i-0028558990229a95b
  PUBLIC_URL: http://15.207.145.62
  SECRETS_MANAGER_ID: deptic/vimix/secrets

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::759204735992:role/vimix-ec2-role
          aws-region: ap-south-1

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build frontend to verify compile
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Frontend build diagnostics
        run: |
          cd vimix-crm-frontend
          npm install --legacy-peer-deps
          npm run build
          ls -la dist

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        run: |
          set -euo pipefail
          FULL_IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY"
          docker build -t "$FULL_IMAGE:latest" -t "$FULL_IMAGE:${GITHUB_SHA::7}" -f Dockerfile .
          docker push "$FULL_IMAGE:latest"
          docker push "$FULL_IMAGE:${GITHUB_SHA::7}"
          echo "IMAGE_URI=$FULL_IMAGE:${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Deploy to EC2 via SSM
        run: |
          set -euo pipefail
          IMAGE_URI="${{ env.IMAGE_URI }}"
          cat > /tmp/ssm-params.json << SSMPARAMS
          {
            "commands": [
              "aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_REGISTRY",
              "docker pull $IMAGE_URI",
              "docker stop app || true",
              "docker rm app || true",
              "SECRET_JSON=$(aws secretsmanager get-secret-value --secret-id $SECRETS_MANAGER_ID --region $AWS_REGION --query SecretString --output text)",
              "MONGO=$(echo \"\$SECRET_JSON\" | python3 -c 'import sys,json;print(json.load(sys.stdin).get(\"MONGODB_URI\",\"\"))')",
              "JWT=$(echo \"\$SECRET_JSON\" | python3 -c 'import sys,json;print(json.load(sys.stdin).get(\"JWT_SECRET\",\"\"))')",
              "docker run -d --restart always -p 80:80 --name app -e MONGODB_URI=\"\$MONGO\" -e JWT_SECRET=\"\$JWT\" -e NODE_ENV=production $IMAGE_URI"
            ]
          }
          SSMPARAMS
          COMMAND_ID=$(aws ssm send-command --instance-ids "$INSTANCE_ID" --region "$AWS_REGION" --document-name "AWS-RunShellScript" --parameters file:///tmp/ssm-params.json --query "Command.CommandId" --output text)
          for i in $(seq 1 30); do
            STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --region "$AWS_REGION" --query Status --output text)
            echo "SSM status: $STATUS"
            [ "$STATUS" = "Success" ] && exit 0
            [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ] && { aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --region "$AWS_REGION"; exit 1; }
            sleep 10
          done
          echo "SSM command timed out"
          exit 1

      - name: Health check
        run: |
          set -euo pipefail
          for i in $(seq 1 20); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" "$PUBLIC_URL/health" || echo "000")
            echo "Attempt $i: HTTP $CODE"
            [ "$CODE" = "200" ] && { echo "Healthy"; exit 0; }
            sleep 10
          done
          echo "Health check failed"
          exit 1