name: Build & Deploy to EC2 Docker

on:
  push:
    branches: ["main"]
  workflow_dispatch:

env:
  AWS_REGION: ap-south-1
  ECR_REGISTRY: 759204735992.dkr.ecr.ap-south-1.amazonaws.com
  ECR_REPOSITORY: vimix
  INSTANCE_ID: i-03909ff558ca03515
  PUBLIC_IP: 65.1.206.192
  CONTAINER_PORT: 80
  DOCKERFILE_PATH: .

jobs:
  deploy:
    name: Build, Push and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push Docker image
        id: build-image
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -e
          FULL_IMAGE="${ECR_REGISTRY}/${ECR_REPOSITORY}"
          echo "Building image ${FULL_IMAGE}:${IMAGE_TAG}"
          docker build -f "${DOCKERFILE_PATH}/Dockerfile" \
            -t "${FULL_IMAGE}:${IMAGE_TAG}" \
            -t "${FULL_IMAGE}:latest" .
          echo "Pushing tags..."
          docker push "${FULL_IMAGE}:${IMAGE_TAG}"
          docker push "${FULL_IMAGE}:latest"
          echo "full_image=${FULL_IMAGE}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Deploy to EC2 via SSM
        env:
          IMAGE_URI: ${{ steps.build-image.outputs.full_image }}:${{ steps.build-image.outputs.image_tag }}
        run: |
          set -e
          REGION="${AWS_REGION}"
          REPO_URL="${ECR_REGISTRY}"
          IMAGE="${IMAGE_URI}"
          INSTANCE="${INSTANCE_ID}"

          # Wait for the SSM agent to be online
          echo "Waiting for SSM agent on instance ${INSTANCE}..."
          for i in $(seq 1 30); do
            STATUS=$(aws ssm describe-instance-information \
              --region "$REGION" \
              --filters "Key=InstanceIds,Values=$INSTANCE" \
              --query "InstanceInformationList[0].PingStatus" \
              --output text 2>/dev/null || echo "Unknown")
            echo "Attempt $i: PingStatus=$STATUS"
            if [ "$STATUS" = "Online" ]; then
              echo "SSM agent is online."
              break
            fi
            sleep 10
          done

          if [ "$STATUS" != "Online" ]; then
            echo "ERROR: SSM agent not online after waiting."
            exit 1
          fi

          # Prepare SSM command payload
          cat > /tmp/ssm-params.json << 'SSMPARAMS'
          {
            "commands": [
              "aws ecr get-login-password --region $REGION | docker login --username AWS --password-stdin $REPO_URL",
              "docker pull $IMAGE",
              "docker stop app || true",
              "docker rm app || true",
              "docker run -d --restart always -p 80:80 --name app $IMAGE"
            ]
          }
          SSMPARAMS

          # Send command
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE" \
            --region "$REGION" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/ssm-params.json \
            --query "Command.CommandId" \
            --output text)

          echo "SSM command sent, ID: $COMMAND_ID"

          # Wait for command to finish
          for i in $(seq 1 30); do
            STATUS=$(aws ssm list-command-invocations \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE" \
              --region "$REGION" \
              --details \
              --query "CommandInvocations[0].Status" \
              --output text)
            echo "Command status: $STATUS"
            if [[ "$STATUS" == "Success" ]]; then
              echo "Deployment command succeeded."
              break
            elif [[ "$STATUS" == "Failed" || "$STATUS" == "Cancelled" || "$STATUS" == "TimedOut" ]]; then
              echo "ERROR: Deployment command $STATUS."
              exit 1
            fi
            sleep 10
          done

      - name: Verify application health
        run: |
          set -e
          URL="http://${PUBLIC_IP}"
          echo "Checking health endpoint at $URL/health ..."
          for i in $(seq 1 12); do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$URL/health" || echo "000")
            if [ "$HTTP_CODE" = "200" ]; then
              echo "Health check passed (200)."
              exit 0
            fi
            echo "Attempt $i: received $HTTP_CODE, retrying in 5s..."
            sleep 5
          done
          echo "ERROR: Health check failed after multiple attempts."
          exit 1