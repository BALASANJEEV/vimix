name: Deploy to Amazon ECS

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      # Source code checkout
      - uses: actions/checkout@v4

      # Set up Node.js for the checkout/build phase
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # Configure AWS credentials from the repository secrets
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # Log in to Amazon ECR
      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Build the Docker image and push it to the ECR registry
      - name: Build, tag, and push image to ECR
        id: build-image
        run: |
          IMAGE_TAG=${GITHUB_SHA::7}
          IMAGE_URI=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${IMAGE_TAG}
          echo "Building Docker image ${IMAGE_URI}"
          docker build -t ${IMAGE_URI} .
          echo "Pushing image ${IMAGE_URI}"
          docker push ${IMAGE_URI}
          echo "IMAGE_URI=${IMAGE_URI}" >> $GITHUB_OUTPUT
        env:
          ECR_REPOSITORY: my-ecs-repo  # <-- replace with your ECR repo name

      # Deploy the updated task definition to the desired ECS service
      - name: Deploy to Amazon ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ecs-task-def.json
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          image: ${{ steps.build-image.outputs.IMAGE_URI }}
          desired-count: 1
        env:
          ECS_CLUSTER: my-ecs-cluster          # <-- replace with your ECS cluster name
          ECS_SERVICE: my-ecs-service          # <-- replace with your ECS service name
}