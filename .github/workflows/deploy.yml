name: Deploy vimix CRM to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGION: ap-south-1
  ECR_REGISTRY: 759204735992.dkr.ecr.ap-south-1.amazonaws.com
  ECR_REPOSITORY: vimix
  INSTANCE_ID: i-0cbf9975c6444f12e
  IMAGE_TAG: ${{ github.sha }}
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_DEFAULT_REGION: ap-south-1

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region "$REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"

      - name: Get secrets from AWS Secrets Manager
        run: |
          SECRETS=$(aws secretsmanager get-secret-value --secret-id deptic/vimix/secrets --query SecretString --output text)
          echo "$SECRETS" | jq -r 'to_entries | .[] | .key + "=" + .value' >> .env.build
          cat .env.build

      - name: Extract VITE_API_URL from secrets
        id: api_url
        run: |
          grep VITE_API_URL .env.build || echo "VITE_API_URL=" >> .env.build
          echo "api_url=$(grep VITE_API_URL .env.build | cut -d= -f2-)" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        run: |
          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker build \
            --build-arg VITE_API_URL="${{ steps.api_url.outputs.api_url }}" \
            -t "$IMAGE_URI" .
          docker push "$IMAGE_URI"
          echo "IMAGE_URI=$IMAGE_URI" >> $GITHUB_ENV

      - name: Tag image as latest
        run: |
          LATEST_URI="$ECR_REGISTRY/$ECR_REPOSITORY:latest"
          docker tag "$IMAGE_URI" "$LATEST_URI"
          docker push "$LATEST_URI"

      - name: Write SSM parameters
        run: |
          cat > /tmp/ssm-params.json << 'SSMPARAMS'
          {
            "commands": [
              "aws ecr get-login-password --region $REGION | docker login --username AWS --password-stdin $ECR_REGISTRY",
              "docker pull $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG",
              "docker stop app || true",
              "docker rm app || true",
              "docker run -d --restart always -p 80:80 --name app $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
            ]
          }
          SSMPARAMS

      - name: Deploy to EC2 via SSM
        env:
          REGION: ap-south-1
          INSTANCE_ID: i-0cbf9975c6444f12e
          IMAGE_TAG: ${{ github.sha }}
          ECR_REGISTRY: 759204735992.dkr.ecr.ap-south-1.amazonaws.com
          ECR_REPOSITORY: vimix
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --region "$REGION" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/ssm-params.json \
            --query "Command.CommandId" \
            --output text)

          echo "SSM command ID: $COMMAND_ID"

          # Wait for command to complete
          sleep 10
          for i in $(seq 1 30); do
            STATUS=$(aws ssm list-command-invocations \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --region "$REGION" \
              --query "CommandInvocations[0].Status" \
              --output text)
            if [ "$STATUS" = "Success" ] || [ "$STATUS" = "Failed" ] || [ "$STATUS" = "TimedOut" ]; then
              echo "SSM command status: $STATUS"
              break
            fi
            sleep 5
          done

      - name: Health check
        run: |
          echo "Waiting for application to start..."
          sleep 15
          for i in $(seq 1 12); do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://35.154.76.18/ 2>/dev/null || echo "000")
            if [ "$HTTP_CODE" = "200" ]; then
              echo "Health check passed - application is running"
              exit 0
            fi
            echo "Attempt $i: HTTP $HTTP_CODE - retrying..."
            sleep 10
          done
          echo "Health check failed - application did not return HTTP 200"
          exit 1