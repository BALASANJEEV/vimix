name: Build Deploy Verify (EC2 Docker)

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY_URI: 759204735992.dkr.ecr.ap-south-1.amazonaws.com/vimix
  ECR_REPOSITORY: vimix
  EC2_INSTANCE_ID: i-0a8f02e99e83b6780
  PUBLIC_URL: http://13.205.50.21
  SECRETS_MANAGER_ID: deptic/vimix/secrets
  CONTAINER_PORT: 5000
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build:
    name: Build & Push Image
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      image: ${{ env.ECR_REPOSITORY_URI }}:${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # ---- Frontend build diagnostics (Vite + React + TypeScript) ----
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        working-directory: vimix-crm-frontend
        run: npm ci

      - name: Lint frontend
        working-directory: vimix-crm-frontend
        run: npm run lint

      - name: Type-check frontend
        working-directory: vimix-crm-frontend
        run: npx tsc -b --noEmit

      - name: Build frontend bundle
        working-directory: vimix-crm-frontend
        run: npm run build

      - name: Verify frontend build output
        run: |
          test -f vimix-crm-frontend/dist/index.html || { echo "::error::vite build did not produce dist/index.html"; exit 1; }
          echo "Frontend bundle OK: $(du -sh vimix-crm-frontend/dist | cut -f1)"

      # ---- Backend build diagnostics (Express + Mongoose ESM) ----
      - name: Install backend dependencies
        working-directory: vimix-crm-backend
        run: npm ci

      - name: Backend syntax check
        working-directory: vimix-crm-backend
        run: node --check server.js

      # ---- Docker image (backend serves API on 5000; frontend bundle included) ----
      - name: Prepare build context
        run: |
          mkdir -p docker-context
          cp -r vimix-crm-backend/. docker-context/
          cp -r vimix-crm-frontend/dist docker-context/dist
          cat > docker-context/Dockerfile <<'EOF'
          FROM node:20-alpine
          WORKDIR /app
          COPY package.json package-lock.json ./
          RUN npm ci --omit=dev
          COPY . .
          ENV PORT=5000
          EXPOSE 5000
          CMD ["node", "server.js"]
          EOF

      - name: Build, tag and push image
        run: |
          docker build -t "$ECR_REPOSITORY_URI:$IMAGE_TAG" -t "$ECR_REPOSITORY_URI:latest" docker-context
          docker push "$ECR_REPOSITORY_URI:$IMAGE_TAG"
          docker push "$ECR_REPOSITORY_URI:latest"
          docker image inspect "$ECR_REPOSITORY_URI:$IMAGE_TAG" --format 'Pushed {{index .RepoTags 0}} ({{.Size}} bytes)'

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy via SSM
        run: |
          cat > deploy.sh <<'EOF'
          set -euo pipefail
          aws ecr get-login-password --region ap-south-1 | docker login --username AWS --password-stdin 759204735992.dkr.ecr.ap-south-1.amazonaws.com
          SECRETS=$(aws secretsmanager get-secret-value --secret-id deptic/vimix/secrets --query SecretString --output text)
          export JWT_SECRET=$(echo "$SECRETS" | jq -r '.JWT_SECRET')
          export MONGODB_URI=$(echo "$SECRETS" | jq -r '.MONGODB_URI')
          export REDIS_URL=$(echo "$SECRETS" | jq -r '.REDIS_URL')
          export FRONTEND_PORT=$(echo "$SECRETS" | jq -r '.FRONTEND_PORT // "9001"')
          docker pull 759204735992.dkr.ecr.ap-south-1.amazonaws.com/vimix:${{ github.sha }}
          docker rm -f vimix-app 2>/dev/null || true
          docker run -d --name vimix-app --restart unless-stopped \
            -p 80:5000 \
            -e PORT=5000 \
            -e JWT_SECRET="$JWT_SECRET" \
            -e MONGODB_URI="$MONGODB_URI" \
            -e REDIS_URL="$REDIS_URL" \
            -e FRONTEND_PORT="$FRONTEND_PORT" \
            759204735992.dkr.ecr.ap-south-1.amazonaws.com/vimix:${{ github.sha }}
          docker ps --filter name=vimix-app --format '{{.Names}} {{.Status}} {{.Image}}'
          EOF
          aws ssm send-command \
            --instance-ids i-0a8f02e99e83b6780 \
            --document-name AWS-RunShellScript \
            --comment "Deploy vimix ${{ github.sha }}" \
            --parameters commands="bash /tmp/deploy.sh" \
            --output-s3-bucket-name ${{ secrets.SSM_LOG_BUCKET }} \
            --output-s3-key-prefix vimix-deploy/${{ github.run_id }} || true
          # Copy script then execute
          SCRIPT_B64=$(base64 -w0 deploy.sh)
          aws ssm send-command \
            --instance-ids i-0a8f02e99e83b6780 \
            --document-name AWS-RunShellScript \
            --comment "Deploy vimix ${{ github.sha }}" \
            --parameters commands="echo $SCRIPT_B64 | base64 -d > /tmp/deploy.sh && bash /tmp/deploy.sh"
          sleep 5
          INVOCATION=$(aws ssm list-command-invocations --instance-id i-0a8f02e99e83b6780 --details --query 'CommandInvocations[0]' --output json)
          STATUS=$(echo "$INVOCATION" | jq -r '.Status')
          echo "SSM command status: $STATUS"
          echo "$INVOCATION" | jq -r '.CommandPlugins[0].Output' || true
          [ "$STATUS" = "Success" ] || { echo "::error::Deployment command failed: $STATUS"; exit 1; }

  verify:
    name: Health Check
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Wait for service readiness
        run: sleep 20

      - name: Verify health endpoint (HTTP 200 required)
        run: |
          for i in $(seq 1 12); do
            CODE=$(curl -s -o /tmp/health_body -w '%{http_code}' --max-time 10 "$PUBLIC_URL/health" || echo "000")
            echo "Attempt $i: HTTP $CODE"
            if [ "$CODE" = "200" ]; then
              echo "Health check passed. Response:"; cat /tmp/health_body; echo
              exit 0
            fi
            sleep 10
          done
          echo "::error::Health check failed at $PUBLIC_URL/health (last status: $CODE)"
          exit 1

      - name: Verify root serves application
        run: |
          CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$PUBLIC_URL/" || echo "000")
          echo "Root endpoint HTTP $CODE"
          [ "$CODE" = "200" ] || { echo "::error::Root endpoint did not return 200"; exit 1; }