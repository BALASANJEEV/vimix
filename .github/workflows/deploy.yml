name: Build & Deploy to EC2 Docker

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      REGION: ap-south-1
      ECR_REPOSITORY_URI: 759204735992.dkr.ecr.ap-south-1.amazonaws.com/vimix
      INSTANCE_ID: i-09cb51a6f25842967
      PUBLIC_URL: http://15.207.49.159
      CONTAINER_PORT: 80
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.REGION }}

      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        id: build-image
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -e
          IMAGE_URI="${ECR_REPOSITORY_URI}:${IMAGE_TAG}"
          echo "Building Docker image ${IMAGE_URI}"
          docker build \
            --progress=plain \
            --file Dockerfile \
            --tag "${IMAGE_URI}" \
            --tag "${ECR_REPOSITORY_URI}:latest" \
            .
          echo "image_uri=${IMAGE_URI}" >> "$GITHUB_OUTPUT"

      - name: Build diagnostics
        run: |
          set -e
          echo "=== Docker images ==="
          docker images --format "table {{.Repository}}\t{{.Tag}}\t{{.Size}}"
          echo "=== Build history for latest image ==="
          docker history "${ECR_REPOSITORY_URI}:latest" | head -n 20

      - name: Push Docker images to ECR
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -e
          IMAGE_URI="${ECR_REPOSITORY_URI}:${IMAGE_TAG}"
          echo "Pushing ${IMAGE_URI}"
          docker push "${IMAGE_URI}"
          echo "Pushing ${ECR_REPOSITORY_URI}:latest"
          docker push "${ECR_REPOSITORY_URI}:latest"

      - name: Deploy image to EC2 via SSM
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -e
          IMAGE_URI="${ECR_REPOSITORY_URI}:${IMAGE_TAG}"
          cat > /tmp/ssm-params.json << 'SSMPARAMS'
          {
            "commands": [
              "aws ecr get-login-password --region $REGION | docker login --username AWS --password-stdin $ECR_REPOSITORY_URI",
              "docker pull $IMAGE_URI",
              "docker stop app || true",
              "docker rm app || true",
              "docker run -d --restart always -p 80:80 --name app $IMAGE_URI"
            ]
          }
          SSMPARAMS

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --region "$REGION" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/ssm-params.json \
            --query "Command.CommandId" \
            --output text)

          echo "SSM command submitted (ID: $COMMAND_ID). Waiting for completion..."
          while true; do
            STATUS=$(aws ssm list-command-invocations \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --region "$REGION" \
              --details \
              --query "CommandInvocations[0].Status" \
              --output text)
            echo "Current SSM status: $STATUS"
            if [[ "$STATUS" == "Success" ]]; then
              echo "SSM command completed successfully."
              break
            elif [[ "$STATUS" == "Failed" || "$STATUS" == "TimedOut" || "$STATUS" == "Cancelled" ]]; then
              echo "SSM command failed with status: $STATUS"
              exit 1
            fi
            sleep 5
          done

      - name: Wait for application health endpoint
        run: |
          set -e
          MAX_ATTEMPTS=30
          SLEEP_SECONDS=10
          for i in $(seq 1 $MAX_ATTEMPTS); do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "${PUBLIC_URL}/health" || echo "000")
            echo "Attempt $i: HTTP $HTTP_CODE"
            if [[ "$HTTP_CODE" == "200" ]]; then
              echo "Health check passed."
              exit 0
            fi
            sleep $SLEEP_SECONDS
          done
          echo "Health check failed after $MAX_ATTEMPTS attempts."
          exit 1