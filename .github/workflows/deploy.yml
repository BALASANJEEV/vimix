name: Build and Deploy to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: vimix-crm
  EC2_INSTANCE_ID: i-xxxxxxxxxxxxxxxxx
  CONTAINER_NAME: app

jobs:
  build-and-push:
    name: Build and Push Image
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image
        id: image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Wait for Docker daemon on EC2
        run: |
          for i in $(seq 1 12); do
            if aws ssm send-command \
              --instance-ids "${{ env.EC2_INSTANCE_ID }}" \
              --document-name "AWS-RunShellScript" \
              --comment "Check docker" \
              --parameters commands='systemctl is-active --quiet docker && echo DOCKER_UP || systemctl start docker' \
              --output text --query 'Command.CommandId' > /tmp/cmdid; then
              CMD_ID=$(cat /tmp/cmdid)
              aws ssm wait command-executed --command-id "$CMD_ID" --instance-id "${{ env.EC2_INSTANCE_ID }}" || true
            fi
            sleep 5
            break
          done

      - name: Deploy container via SSM
        env:
          IMAGE: ${{ needs.build-and-push.outputs.image }}
        run: |
          CMD_ID=$(aws ssm send-command \
            --instance-ids "${{ env.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy app container" \
            --parameters commands="[
              \"set -e\",
              \"aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin ${{ needs.build-and-push.outputs.image }}\".split('/')[0],
              \"systemctl is-active --quiet docker || (systemctl start docker && sleep 10)\",
              \"docker pull ${IMAGE}\",
              \"docker stop ${CONTAINER_NAME} 2>/dev/null || true\",
              \"docker rm -f ${CONTAINER_NAME} 2>/dev/null || true\",
              \"docker run -d --name ${CONTAINER_NAME} --restart unless-stopped -p 80:80 -e NODE_ENV=production ${IMAGE}\",
              \"docker ps | grep ${CONTAINER_NAME}\"
            ]" \
            --output text --query 'Command.CommandId')
          aws ssm wait command-executed --command-id "$CMD_ID" --instance-id "${{ env.EC2_INSTANCE_ID }}"
          STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "${{ env.EC2_INSTANCE_ID }}" --query 'Status' --output text)
          if [ "$STATUS" != "Success" ]; then
            aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "${{ env.EC2_INSTANCE_ID }}" --query 'StandardErrorContent' --output text
            exit 1
          fi

  health-check:
    name: Health Check
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Health check with retries
        run: |
          for i in $(seq 1 10); do
            CMD_ID=$(aws ssm send-command \
              --instance-ids "${{ env.EC2_INSTANCE_ID }}" \
              --document-name "AWS-RunShellScript" \
              --comment "Health check" \
              --parameters commands='curl -fsS http://127.0.0.1/health || docker logs app --tail 50 || true' \
              --output text --query 'Command.CommandId')
            aws ssm wait command-executed --command-id "$CMD_ID" --instance-id "${{ env.EC2_INSTANCE_ID }}" || true
            OUTPUT=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "${{ env.EC2_INSTANCE_ID }}" --query 'StandardOutputContent' --output text)
            if echo "$OUTPUT" | grep -q 'Server is running'; then
              echo "Healthy!"
              exit 0
            fi
            echo "Attempt $i failed, retrying..."
            sleep 15
          done
          exit 1
