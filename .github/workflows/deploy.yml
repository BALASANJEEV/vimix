name: Deploy to EC2

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          docker build -t vimix-app .

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Deploy to EC2 via SSM
        run: |
          # Save the image to a tar file
          docker save vimix-app | gzip > /tmp/vimix-app.tar.gz
          
          # Upload to EC2
          aws ssm send-command \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=["mkdir -p /opt/vimix", "cd /opt/vimix"]'
          
          # Copy the image tar to EC2
          scp -o StrictHostKeyChecking=no -i /tmp/ssh_key /tmp/vimix-app.tar.gz ec2-user@${{ secrets.EC2_HOST }}:/opt/vimix/
          
          # Load and run the image on EC2
          ssh -o StrictHostKeyChecking=no -i /tmp/ssh_key ec2-user@${{ secrets.EC2_HOST }} << 'EOF'
            cd /opt/vimix
            # Stop and remove old container if exists
            docker stop vimix-app 2>/dev/null || true
            docker rm vimix-app 2>/dev/null || true
            # Load new image
            gunzip -c vimix-app.tar.gz | docker load
            # Run the container
            docker run -d \
              --name vimix-app \
              --restart unless-stopped \
              -p 80:80 \
              -p 5000:5000 \
              -e MONGO_URI=${{ secrets.MONGO_URI }} \
              -e JWT_SECRET=${{ secrets.JWT_SECRET }} \
              -e NODE_ENV=production \
              vimix-app
          EOF

      - name: Cleanup
        if: always()
        run: |
          rm -f /tmp/vimix-app.tar.gz
          rm -f /tmp/ssh_key