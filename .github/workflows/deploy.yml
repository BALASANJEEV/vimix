# .github/workflows/deploy.yml
name: Deploy to ECS
on:
  push:
    branches:
      - main
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registry: ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com
      - name: Build Docker image
        run: |
          IMAGE_TAG=${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV
          docker build -t $IMAGE_TAG .
      - name: Push Docker image to ECR
        run: |
          docker push $IMAGE_TAG
      - name: Register new task definition
        id: update-task-def
        run: |
          # Retrieve the current task definition
          TASK_DEFINITION_JSON=$(aws ecs describe-task-definition --task-definition vimix-task)
          # Extract the container definition part
          CONTAINER_DEFINITION=$(echo "$TASK_DEFINITION_JSON" | jq -c '.taskDefinition.containerDefinitions[0]')
          # Replace the image with the new one
          UPDATED_CONTAINER=$(echo "$CONTAINER_DEFINITION" | jq --arg image "$IMAGE_TAG" '.image = $image')
          # Build a new task definition payload
          NEW_TASK_DEFINITION=$(echo "$TASK_DEFINITION_JSON" | jq ".taskDefinition | del(.revision) | del(.status) | del(.requiresAttributes) | del(.compatibilities) | del(.registeredAt) | del(.registeredBy) | .containerDefinitions[0] = $UPDATED_CONTAINER")
          echo "$NEW_TASK_DEFINITION" > updated-task-definition.json
          echo "New task definition saved"
      - name: Deploy task
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: updated-task-definition.json
          service: vimix-service
          cluster: vimix-cluster
          wait-for-service-stability: true
      - name: Verify deployment
        run: |
          echo "Deployment finished – check ECS service status for success."
