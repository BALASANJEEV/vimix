name: Deploy Vimix CRM to EC2 Docker

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: vimix
  INSTANCE_ID: i-044038190445ed3fd

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::759204735992:role/vimix-github-actions-role
          aws-region: ap-south-1

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute image URI
        run: |
          echo "IMAGE_URI=${{ steps.ecr.outputs.registry }}/vimix" >> "$GITHUB_ENV"

      - name: Build and push image
        run: |
          IMAGE_URI="$IMAGE_URI" \
          docker build -t "$IMAGE_URI:latest" -t "$IMAGE_URI:${GITHUB_SHA::12}" -f Dockerfile . 2>&1 | tee /tmp/build.log
          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo "Docker build failed. Diagnostics:" | tee /tmp/diag.txt
            tail -100 /tmp/build.log | tee -a /tmp/diag.txt
            exit 1
          fi
          docker push "$IMAGE_URI:latest"
          docker push "$IMAGE_URI:${GITHUB_SHA::12}"

      - name: Pull secrets from AWS Secrets Manager
        id: secrets
        run: |
          SECRETS_JSON=$(aws secretsmanager get-secret-value \
            --secret-id "deptic/vimix/secrets" \
            --region ap-south-1 \
            --query SecretString --output text)
          MONGODB_URI=$(echo "$SECRETS_JSON" | jq -r '.MONGODB_URI // .MONGO_URI // empty')
          JWT_SECRET=$(echo "$SECRETS_JSON" | jq -r '.JWT_SECRET // empty')
          REDIS_URL=$(echo "$SECRETS_JSON" | jq -r '.REDIS_URL // empty')
          echo "MONGODB_URI=$MONGODB_URI" >> "$GITHUB_ENV"
          echo "JWT_SECRET=$JWT_SECRET" >> "$GITHUB_ENV"
          echo "REDIS_URL=$REDIS_URL" >> "$GITHUB_ENV"

      - name: Deploy to EC2 via SSM
        run: |
          IMAGE_URI="$IMAGE_URI"
          INSTANCE_ID="$INSTANCE_ID"
          REGION="$AWS_REGION"
          MONGODB_URI="$MONGODB_URI"
          JWT_SECRET="$JWT_SECRET"
          REDIS_URL="$REDIS_URL"

          cat > /tmp/ssm-params.json << SSMPARAMS
          {
            "commands": [
              "aws ecr get-login-password --region $REGION | docker login --username AWS --password-stdin ${IMAGE_URI%%/*}",
              "docker pull $IMAGE_URI:latest",
              "docker stop app || true",
              "docker rm app || true",
              "docker run -d --restart always -p 80:80 --name app -e PORT=5000 -e NODE_ENV=production -e MONGODB_URI='$MONGODB_URI' -e JWT_SECRET='$JWT_SECRET' -e REDIS_URL='$REDIS_URL' $IMAGE_URI:latest",
              "sleep 10",
              "docker ps --filter name=app --format '{{.Status}}'"
            ]
          }
          SSMPARAMS

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --region "$REGION" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/ssm-params.json \
            --query "Command.CommandId" --output text)

          echo "SSM command id: $COMMAND_ID"
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --region "$REGION"
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --region "$REGION" \
            --query '[Status, StandardOutputContent, StandardErrorContent]' \
            --output text

      - name: Health check
        run: |
          for i in $(seq 1 20); do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "http://13.234.210.33/health" || true)
            echo "Attempt $i: HTTP $HTTP_CODE"
            if [ "$HTTP_CODE" = "200" ]; then
              echo "Deployment healthy."
              exit 0
            fi
            sleep 15
          done
          echo "Health check failed after retries."
          exit 1