name: Build and Deploy to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: vimix-crm
  CONTAINER_NAME: app

jobs:
  build-push:
    name: Build and Push Image
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Compute image tag
        id: image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          IMAGE_TAG=${GITHUB_SHA::7}
          IMAGE="$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "Computed image: $IMAGE"

      - name: Build image
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: docker build -t "$IMAGE" .

      - name: Push image
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: docker push "$IMAGE"

  deploy:
    name: Deploy to EC2
    needs: build-push
    if: ${{ success() && needs.build-push.outputs.image != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy via SSM
        uses: aws-actions/ssm-send-command@v1
        with:
          aws-region: ${{ env.AWS_REGION }}
          instance-ids: ${{ secrets.EC2_INSTANCE_ID }}
          comment: Deploy latest vimix image
          command: |
            set -e
            aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin ${{ needs.build-push.outputs.image }}
            docker pull ${{ needs.build-push.outputs.image }}
            docker rm -f ${{ env.CONTAINER_NAME }} 2>/dev/null || true
            docker run -d --name ${{ env.CONTAINER_NAME }} --restart unless-stopped -p 80:80 \
              -e MONGO_URI='${{ secrets.MONGO_URI }}' \
              -e JWT_SECRET='${{ secrets.JWT_SECRET }}' \
              -v /home/ec2-user/uploads:/usr/src/app/uploads \
              ${{ needs.build-push.outputs.image }}
            docker ps

  health-check:
    name: Health Check
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Wait for service health
        run: |
          for i in $(seq 1 15); do
            if curl -fsS --max-time 5 http://${{ secrets.EC2_PUBLIC_IP }}/health; then
              echo "Service healthy"
              exit 0
            fi
            echo "Attempt $i failed; retrying in 10s..."
            sleep 10
          done
          echo "Service failed to become healthy"
          exit 1
