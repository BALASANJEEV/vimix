name: Deploy to EC2

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build Docker image
        run: docker build -t vimix-app .
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      - name: Save Docker image
        run: docker save vimix-app | gzip > vimix-app.tar.gz
      - name: Upload image to EC2
        run: |
          scp -o StrictHostKeyChecking=no -i key.pem vimix-app.tar.gz ec2-user@${{ secrets.EC2_HOST }}:/home/ec2-user/
      - name: Deploy on EC2
        run: |
          ssh -o StrictHostKeyChecking=no -i key.pem ec2-user@${{ secrets.EC2_HOST }} << 'EOF'
            docker load < /home/ec2-user/vimix-app.tar.gz
            docker stop vimix || true
            docker rm vimix || true
            docker run -d --name vimix -p 80:80 vimix-app
          EOF