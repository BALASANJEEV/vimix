name: CI/CD - Build, Deploy, Verify

on:
  push:
    branches:
      - main

env:
  ECR_REGISTRY: 759204735992.dkr.ecr.ap-south-1.amazonaws.com
  REGION: ap-south-1
  INSTANCE_ID: i-0d9bc861d7f1da138
  PUBLIC_URL: http://3.111.163.127

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.REGION }}

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registry: ${{ env.ECR_REGISTRY }}

      - name: Build and push backend image
        run: |
          docker build -t vimix-backend:latest ./vimix-crm-backend
          docker tag vimix-backend:latest ${{ env.ECR_REGISTRY }}/vimix-backend:${{ github.sha }}
          docker push ${{ env.ECR_REGISTRY }}/vimix-backend:${{ github.sha }}

      - name: Build and push frontend image
        run: |
          docker build -t vimix-frontend:latest ./vimix-crm-frontend
          docker tag vimix-frontend:latest ${{ env.ECR_REGISTRY }}/vimix-frontend:${{ github.sha }}
          docker push ${{ env.ECR_REGISTRY }}/vimix-frontend:${{ github.sha }}

      - name: Deploy to EC2 via SSM
        env:
          BACKEND_IMAGE_URI: ${{ env.ECR_REGISTRY }}/vimix-backend:${{ github.sha }}
          FRONTEND_IMAGE_URI: ${{ env.ECR_REGISTRY }}/vimix-frontend:${{ github.sha }}
        run: |
          cat > /tmp/ssm-params.json <<EOF
          {
            "commands": [
              "aws ecr get-login-password --region $REGION | docker login --username AWS --password-stdin $ECR_REGISTRY",
              "docker pull $BACKEND_IMAGE_URI",
              "docker stop vimix-backend || true",
              "docker rm vimix-backend || true",
              "docker run -d --restart always -p 5000:5000 --name vimix-backend $BACKEND_IMAGE_URI",
              "docker pull $FRONTEND_IMAGE_URI",
              "docker stop vimix-frontend || true",
              "docker rm vimix-frontend || true",
              "docker run -d --restart always -p 80:80 --name vimix-frontend $FRONTEND_IMAGE_URI"
            ]
          }
          EOF

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --region "$REGION" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/ssm-params.json \
            --query "Command.CommandId" --output text)
          echo "SSM command ID: $COMMAND_ID"

          echo "Waiting for SSM command to complete..."
          while true; do
            STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --region "$REGION" --query "Status" --output text)
            echo "Status: $STATUS"
            if [[ "$STATUS" == "Success" ]]; then
              break
            elif [[ "$STATUS" == "Failed" || "$STATUS" == "TimedOut" || "$STATUS" == "Cancelled" ]]; then
              echo "SSM command failed with status $STATUS"
              exit 1
            fi
            sleep 5
          done
          echo "SSM command completed successfully"

          echo "Performing health check on backend"
          if ! curl -f "$PUBLIC_URL:5000/health"; then
            echo "Health check failed"
            exit 1
          else
            echo "Health check succeeded"
          fi

# End of workflow #