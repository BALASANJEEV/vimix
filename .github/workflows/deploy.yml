name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Install dependencies
      run: |
        cd vimix-crm-backend && npm ci
        cd ../vimix-crm-frontend && npm ci

    - name: Build frontend
      run: |
        cd vimix-crm-frontend && npm run build

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1

    - name: Build and push Docker image
      run: |
        docker build -t vimix-crm-app .
        docker tag vimix-crm-app:latest ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com/vimix-crm-app:latest
        docker push ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com/vimix-crm-app:latest

    - name: Deploy to EC2 via SSM
      uses: peterkimzz/aws-ssm-send-command@v1.0.0
      with:
        aws-region: us-east-1
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        instance-ids: ${{ secrets.EC2_INSTANCE_ID }}
        command: |
          # Authenticate to ECR
          aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com

          # Stop and remove existing container if it exists
          docker stop vimix-crm-app || true
          docker rm vimix-crm-app || true

          # Pull and run the new image
          docker pull ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com/vimix-crm-app:latest
          docker run -d \
            --name vimix-crm-app \
            -p 80:80 \
            -e NODE_ENV=production \
            -e PORT=5000 \
            -e DATABASE_URL=your_database_url \
            ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com/vimix-crm-app:latest

          # Verify the container is running
          sleep 10
          docker ps | grep vimix-crm-app || echo 'Container failed to start'
