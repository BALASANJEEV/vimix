name: Production Deployment

on:
  push:
    branches:
      - main

env:
  ECR_REPOSITORY_URI: 759204735992.dkr.ecr.ap-south-1.amazonaws.com/vimix
  REGION: ap-south-1
  INSTANCE_ID: i-00587c18cd4c1fafd
  PUBLIC_URL: http://16.4.4.34
  CONTAINER_PORT: 5000

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        run: |
          IMAGE_TAG="${GITHUB_SHA}"
          IMAGE_URI="${ECR_REPOSITORY_URI}:${IMAGE_TAG}"
          echo "Building image ${IMAGE_URI}"
          docker build -t "${IMAGE_URI}" .
          echo "Pushing image ${IMAGE_URI}"
          docker push "${IMAGE_URI}"
        env:
          ECR_REPOSITORY_URI: ${{ env.ECR_REPOSITORY_URI }}

      - name: Deploy container on EC2 via SSM
        run: |
          IMAGE_URI="${ECR_REPOSITORY_URI}:${GITHUB_SHA}"
          ECR_REGISTRY=$(echo "${ECR_REPOSITORY_URI}" | cut -d'/' -f1)
          echo "Deploying ${IMAGE_URI} to instance ${INSTANCE_ID}"

          cat > /tmp/ssm-params.json << SSMPARAMS
          {
            "commands": [
              "aws ecr get-login-password --region ${REGION} | docker login --username AWS --password-stdin ${ECR_REGISTRY}",
              "docker pull ${IMAGE_URI}",
              "docker stop vimix 2>/dev/null || true",
              "docker rm vimix 2>/dev/null || true",
              "docker run -d --restart always -p 80:80 -p 5000:5000 --name vimix ${IMAGE_URI}"
            ]
          }
          SSMPARAMS

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${INSTANCE_ID}" \
            --region "${REGION}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy Docker image" \
            --parameters file:///tmp/ssm-params.json \
            --query "Command.CommandId" \
            --output text)

          echo "Waiting for SSM command ${COMMAND_ID} to complete..."
          aws ssm wait command-executed \
            --instance-id "${INSTANCE_ID}" \
            --region "${REGION}" \
            --command-id "${COMMAND_ID}"
        env:
          ECR_REPOSITORY_URI: ${{ env.ECR_REPOSITORY_URI }}
          REGION: ${{ env.REGION }}
          INSTANCE_ID: ${{ env.INSTANCE_ID }}
          CONTAINER_PORT: ${{ env.CONTAINER_PORT }}

      - name: Health check
        run: |
          echo "Starting health checks against ${PUBLIC_URL}"
          for i in $(seq 1 10); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${PUBLIC_URL}")
            if [ "$STATUS" -eq 200 ]; then
              echo "Health check passed (HTTP 200)"
              exit 0
            fi
            echo "Attempt $i: Service not ready (HTTP $STATUS). Retrying in 10s..."
            sleep 10
          done
          echo "Health check failed after multiple attempts."
          exit 1
        env:
          PUBLIC_URL: ${{ env.PUBLIC_URL }}