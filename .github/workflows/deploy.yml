name: Deploy Vimix CRM to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGION: ap-south-1
  ECR_REGISTRY: 759204735992.dkr.ecr.ap-south-1.amazonaws.com
  ECR_REPOSITORY: vimix
  INSTANCE_ID: i-0cbf9975c6444f12e
  CONTAINER_PORT: 80
  NODE_VERSION: "20"

jobs:
  build-and-deploy:
    name: Build, Push & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Frontend build diagnostics
        run: |
          echo "--- Frontend dependency check ---"
          cd vimix-crm-frontend
          npm install --legacy-peer-deps --no-audit --no-fund
          echo "--- Frontend lint ---"
          npm run lint 2>&1 || echo "Lint warnings (non-fatal)"
          echo "--- Frontend build ---"
          npm run build 2>&1
          ls -la dist/ || echo "No dist directory found"

      - name: Backend build diagnostics
        run: |
          echo "--- Backend dependency check ---"
          cd vimix-crm-backend
          npm install --omit=dev --legacy-peer-deps --no-audit --no-fund
          echo "--- Backend server syntax check ---"
          node --check server.js && echo "Syntax OK" || echo "Syntax issues"

      - name: Docker meta
        id: meta
        run: |
          COMMIT_HASH="${GITHUB_SHA::8}"
          echo "COMMIT_HASH=$COMMIT_HASH"
          echo "IMAGE_TAG=commit-${COMMIT_HASH}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          docker build \
            --build-arg VITE_API_URL="http://35.154.76.18" \
            -t vimix:${{ steps.meta.outputs.IMAGE_TAG }} \
            -f Dockerfile .

      - name: Tag and push to ECR
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          aws ecr get-login-password --region "$REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"
          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:${{ steps.meta.outputs.IMAGE_TAG }}"
          docker tag vimix:${{ steps.meta.outputs.IMAGE_TAG }} "$IMAGE_URI"
          docker push "$IMAGE_URI"
          echo "IMAGE_URI=$IMAGE_URI" >> $GITHUB_ENV
          echo "Pushed image: $IMAGE_URI"

      - name: Tag as latest
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          LATEST_TAG="$ECR_REGISTRY/$ECR_REPOSITORY:latest"
          docker tag vimix:${{ steps.meta.outputs.IMAGE_TAG }} "$LATEST_TAG"
          docker push "$LATEST_TAG"
          echo "Pushed latest tag: $LATEST_TAG"

      - name: Deploy to EC2 via SSM
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          INSTANCE_ID="${{ env.INSTANCE_ID }}"
          REGION="${{ env.REGION }}"
          ECR_REGISTRY="${{ env.ECR_REGISTRY }}"
          IMAGE_URI="${{ env.IMAGE_URI }}"

          # Write SSM parameters to file
          cat > /tmp/ssm-params.json << 'SSMPARAMS'
          {
            "commands": [
              "aws ecr get-login-password --region $REGION | docker login --username AWS --password-stdin $ECR_REGISTRY",
              "docker pull $IMAGE_URI",
              "docker stop vimix-app || true",
              "docker rm vimix-app || true",
              "docker run -d --restart always -p $CONTAINER_PORT:80 --name vimix-app -e NODE_ENV=production -e PORT=5000 $IMAGE_URI"
            ]
          }
          SSMPARAMS

          echo "Sending SSM command to instance $INSTANCE_ID..."
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --region "$REGION" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/ssm-params.json \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"
          echo "Waiting for command to complete..."
          for i in $(seq 1 30); do
            STATUS=$(aws ssm list-command-invocations \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --region "$REGION" \
              --query "CommandInvocations[0].Status" \
              --output text)
            if [ "$STATUS" = "Success" ]; then
              echo "Deployment completed successfully!"
              exit 0
            elif [ "$STATUS" = "Failed" ] || [ "$STATUS" = "TimedOut" ]; then
              echo "Deployment failed with status: $STATUS"
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --region "$REGION" \
                --query "StandardOutputContent" \
                --output text
              exit 1
            fi
            echo "Waiting... ($i/30)"
            sleep 10
          done
          echo "Deployment timed out waiting for completion"
          exit 1

      - name: Health check
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          PUBLIC_URL="http://35.154.76.18"
          echo "Running health check against $PUBLIC_URL..."
          for i in $(seq 1 10); do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$PUBLIC_URL/health" || echo "failed")
            if [ "$HTTP_CODE" = "200" ]; then
              echo "Health check passed! HTTP 200 OK"
              exit 0
            fi
            echo "Attempt $i: HTTP $HTTP_CODE - retrying in 10 seconds..."
            sleep 10
          done
          # Final check with details
          echo "Final health check result:"
          curl -v "$PUBLIC_URL/health" 2>&1 || true
          echo ""
          echo "Health check failed after all retries"
          exit 1