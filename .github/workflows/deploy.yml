```yaml
name: Build, Deploy and Verify - Vimix CRM (EC2 Docker)

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGION: ap-south-1
  ECR_REGISTRY: 759204735992.dkr.ecr.ap-south-1.amazonaws.com
  ECR_REPOSITORY: vimix
  INSTANCE_ID: i-0f69cde36ec6a70fb
  PUBLIC_URL: http://35.154.66.62

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:

      # ============================================================
      # Checkout
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # Docker Buildx
      # ============================================================
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ============================================================
      # Configure AWS
      # ============================================================
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.REGION }}

      # ============================================================
      # Login to ECR
      # ============================================================
      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password \
            --region "$REGION" | \
            docker login \
              --username AWS \
              --password-stdin "$ECR_REGISTRY"

      # ============================================================
      # Build Docker Image
      # ============================================================
      - name: Build Docker image
        run: |
          IMAGE_TAG="${GITHUB_SHA::8}-$(date +%Y%m%d%H%M%S)"
          FULL_IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

          echo "Building image:"
          echo "$FULL_IMAGE_URI"

          docker build \
            --build-arg VITE_API_URL="" \
            -f Dockerfile \
            -t "$FULL_IMAGE_URI" \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:latest" \
            .

          echo "FULL_IMAGE_URI=$FULL_IMAGE_URI" >> "$GITHUB_ENV"

      # ============================================================
      # Push Docker Image
      # ============================================================
      - name: Push Docker image
        run: |
          echo "Pushing:"
          echo "$FULL_IMAGE_URI"

          docker push "$FULL_IMAGE_URI"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:latest"

      # ============================================================
      # Deploy to EC2 through AWS SSM
      # ============================================================
      - name: Deploy to EC2 via SSM
        run: |

          echo "Deploying image:"
          echo "$FULL_IMAGE_URI"

          cat > /tmp/ssm-params.json <<EOF
          {
            "commands": [
              "set -e",
              "echo 'Logging into Amazon ECR...'",
              "aws ecr get-login-password --region '$REGION' | docker login --username AWS --password-stdin '$ECR_REGISTRY'",
              "echo 'Pulling Docker image...'",
              "docker pull '$FULL_IMAGE_URI'",
              "echo 'Stopping old container...'",
              "docker stop vimix-app || true",
              "docker rm vimix-app || true",
              "echo 'Starting new container...'",
              "docker run -d --restart always -p 80:80 -p 5000:5000 --name vimix-app '$FULL_IMAGE_URI'",
              "echo 'Waiting for container to start...'",
              "sleep 10",
              "echo 'Docker container status:'",
              "docker ps -a --filter name=vimix-app",
              "echo 'Container logs:'",
              "docker logs --tail 100 vimix-app",
              "echo 'Testing Nginx/frontend...'",
              "curl -f http://localhost:80/ || exit 1",
              "echo 'Testing backend health endpoint...'",
              "curl -f http://localhost:80/health || exit 1",
              "echo 'Deployment successful.'"
            ]
          }
          EOF

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --region "$REGION" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/ssm-params.json \
            --comment "Deploy Vimix CRM $FULL_IMAGE_URI" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          STATUS="Pending"

          for i in {1..30}; do
            sleep 10

            STATUS=$(aws ssm list-command-invocations \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --region "$REGION" \
              --details \
              --query "CommandInvocations[0].Status" \
              --output text)

            echo "SSM status: $STATUS"

            if [ "$STATUS" = "Success" ]; then
              echo "SSM deployment completed successfully."
              break
            fi

            if [ "$STATUS" = "Failed" ] || \
               [ "$STATUS" = "TimedOut" ] || \
               [ "$STATUS" = "Cancelled" ] || \
               [ "$STATUS" = "Cancelling" ]; then

              echo "SSM deployment failed with status: $STATUS"

              echo "========== SSM OUTPUT =========="
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --region "$REGION" \
                --query '{Status:Status,StdOut:StandardOutputContent,StdErr:StandardErrorContent}' \
                --output json

              exit 1
            fi
          done

          if [ "$STATUS" != "Success" ]; then
            echo "SSM command did not complete successfully."
            exit 1
          fi

      # ============================================================
      # Public Health Check
      # ============================================================
      - name: Verify deployment health
        run: |

          echo "Waiting for application..."
          sleep 10

          for i in {1..12}; do

            HTTP_STATUS=$(curl \
              --connect-timeout 5 \
              --max-time 10 \
              -s \
              -o /dev/null \
              -w "%{http_code}" \
              "$PUBLIC_URL/health" || true)

            echo "Health check attempt $i: HTTP $HTTP_STATUS"

            if [ "$HTTP_STATUS" = "200" ]; then
              echo ""
              echo "========================================"
              echo "Vimix CRM deployment successful!"
              echo "Health check: HTTP 200"
              echo "URL: $PUBLIC_URL"
              echo "========================================"
              exit 0
            fi

            sleep 5
          done

          echo ""
          echo "========================================"
          echo "Deployment health check FAILED"
          echo "========================================"

          exit 1
```
